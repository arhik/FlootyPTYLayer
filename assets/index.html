        // ---- UI settings (wallpaper / grain), persisted via Julia bindings --
        // File-backed under ~/.flooty/settings.json (flootySettingsLoad/Save).
        const SETTINGS_DEFAULTS = { blur: 12, gain: 1, scrim: 0.55, saturation: 1.1, wallOpacity: 1, uiOpacity: 1, grain: 0.05 };
        const SETTINGS_FIELDS = [
            ['setBlur', 'blur', 0],
            ['setGain', 'gain', 2],
            ['setScrim', 'scrim', 2],
            ['setSaturation', 'saturation', 2],
            ['setWallOpacity', 'wallOpacity', 2],
            ['setUiOpacity', 'uiOpacity', 2],
            ['setGrain', 'grain', 2],
        ];
        let currentSettings = Object.assign({}, SETTINGS_DEFAULTS);

        function applySettings(s) {
            const root = document.documentElement;
            root.style.setProperty('--backdrop-blur', String(s.blur) + 'px');
            root.style.setProperty('--backdrop-gain', String(s.gain));
            root.style.setProperty('--backdrop-scrim', String(s.scrim));
            root.style.setProperty('--backdrop-sat', String(s.saturation));
            root.style.setProperty('--wall-opacity', String(s.wallOpacity));
            root.style.setProperty('--ui-opacity', String(s.uiOpacity));
            const grain = document.getElementById('grain');
            if (grain) grain.style.opacity = String(s.grain);
        }

        function settingsLabel(key, v, digits) {
            return Number(v).toFixed(digits) + (key === 'blur' ? 'px' : '');
        }

        function syncSettingsPanel() {
            for (const [id, key, digits] of SETTINGS_FIELDS) {
                const input = document.getElementById(id);
                const label = document.getElementById(id + 'Val');
                if (input) input.value = currentSettings[key];
                if (label) label.textContent = settingsLabel(key, currentSettings[key], digits);
            }
        }

        function saveUiSettings() {
            return callJulia('flootySettingsSave',
                JSON.stringify({ settings: currentSettings }))
                .catch(function (err) {
                    try { window.flootyDebug && window.flootyDebug('settings save FAILED: ' + err); } catch (_e) {}
                });
        }

        function toggleSettingsPanel(show) {
            const panel = document.getElementById('settingsPanel');
            if (!panel) return;
            const want = typeof show === 'boolean' ? show : panel.hidden;
            panel.hidden = !want;
        }
        window.toggleSettingsPanel = toggleSettingsPanel;

        function loadUiSettings() {
            return callJulia('flootySettingsLoad', '{}').then(function (result) {
                if (result && result.success && result.settings &&
                    typeof result.settings === 'object') {
                    currentSettings = Object.assign({}, SETTINGS_DEFAULTS, result.settings);
                }
                applySettings(currentSettings);
                syncSettingsPanel();
            }).catch(function () {
                applySettings(currentSettings);
                syncSettingsPanel();
            });
        }

        (function installSettingsPanel() {
            const panel = document.getElementById('settingsPanel');
            if (!panel) return;
            panel.addEventListener('click', function (e) {
                if (e.target === panel) toggleSettingsPanel(false);
            });
            for (const [id, key, digits] of SETTINGS_FIELDS) {
                const input = document.getElementById(id);
                if (!input) continue;
                input.addEventListener('input', function () {
                    const v = parseFloat(input.value);
                    if (!isFinite(v)) return;
                    currentSettings[key] = v;
                    const label = document.getElementById(id + 'Val');
                    if (label) label.textContent = settingsLabel(key, v, digits);
                    applySettings(currentSettings);
                });
                input.addEventListener('change', saveUiSettings);
            }
            document.getElementById('settingsReset').addEventListener('click', function () {
                currentSettings = Object.assign({}, SETTINGS_DEFAULTS);
                applySettings(currentSettings);
                syncSettingsPanel();
                saveUiSettings();
            });
            document.getElementById('settingsClose').addEventListener('click', function () {
                toggleSettingsPanel(false);
            });
            document.addEventListener('keydown', function (e) {
                if (!panel.hidden && e.key === 'Escape') {
                    e.preventDefault();
                    e.stopPropagation();
                    toggleSettingsPanel(false);
                }
            }, true);
            loadUiSettings();
        })();

        // ---- session-type chooser (radial) --------------------------------
        let sessionChooserMode = 'child';
        let sessionChooserOrientation = 'vertical';
        let lastPointerX = window.innerWidth / 2;
        let lastPointerY = window.innerHeight / 2;
        window.addEventListener('mousemove', function (e) {
            lastPointerX = e.clientX;
            lastPointerY = e.clientY;
        }, { passive: true });

        "Place visible items on a ring around the pointer, Blender pie-style."
        function layoutSessionWheel() {
            const wheel = document.getElementById('sessionWheel');
            if (!wheel) return;
            const items = Array.from(
                wheel.querySelectorAll('[data-session-kind]')).filter(b => !b.hidden);
            if (!items.length) return;
            const margin = Math.min(150, window.innerWidth / 2,
                                    window.innerHeight / 2);
            const cx = Math.min(Math.max(lastPointerX, margin),
                                window.innerWidth - margin);
            const cy = Math.min(Math.max(lastPointerY, margin),
                                window.innerHeight - margin);
            wheel.style.left = cx + 'px';
            wheel.style.top = cy + 'px';
            const radius = Math.max(78, Math.min(118,
                Math.min(window.innerWidth, window.innerHeight) * 0.125));
            const start = -Math.PI / 2;
            items.forEach(function (btn, i) {
                const a = start + (i * 2 * Math.PI / items.length);
                btn.style.left = (Math.cos(a) * radius) + 'px';
                btn.style.top = (Math.sin(a) * radius) + 'px';
            });
        }

        function openSessionChooser(mode, orientation) {
            sessionChooserMode = (mode === 'root' || mode === 'split' || mode === 'sibling')
                ? mode : 'child';
            sessionChooserOrientation =
                orientation === 'horizontal' ? 'horizontal' : 'vertical';
            const el = document.getElementById('sessionChooser');
            const title = document.getElementById('sessionChooserTitle');
            if (!el || !title) return;
            title.textContent = sessionChooserMode === 'root'
                ? 'New root session'
                : (sessionChooserMode === 'split' || sessionChooserMode === 'sibling')
                    ? 'Sibling session'
                    : 'Spawn child session';
            const split = el.querySelector('[data-session-kind="split"]');
            // In split mode the TERMINAL item already means "split terminal";
            // root has no split option, child mode keeps the explicit item.
            if (split) split.hidden = sessionChooserMode !== 'child';
            el.hidden = false;
            layoutSessionWheel();
            requestAnimationFrame(layoutSessionWheel);
            return undefined;
        }
        window.addEventListener('resize', function () {
            const el = document.getElementById('sessionChooser');
            if (el && !el.hidden) layoutSessionWheel();
        });
        function closeSessionChooser() {
            const el = document.getElementById('sessionChooser');
            if (el) el.hidden = true;
        }
        function toggleTreeMap(force) {
            const el = document.getElementById('childTabs');
            if (!el) return;
            const open = force === undefined ? !el.classList.contains('tree-map-open') : !!force;
            el.classList.toggle('tree-map-open', open);
            if (open) renderChildStrips();
        }
        window.toggleTreeMap = toggleTreeMap;
        const TYPST_DEV_ROOT = '/Users/arhik/tmp/typst_example';

        function spawnFileTreeSession(parentId) {
            return callJulia('flootyNewFileTreeSession', JSON.stringify({
                parent_id: parentId || '', folder_id: '', name: 'File tree'
            })).catch(function () {});
        }

        function spawnTypstSession(parentId) {
            // Temporary development shortcut: this project was used to test the
            // compound Typst session before folder selection is finalized.
            return callJulia('flootyNewTypstSession', JSON.stringify({
                parent_id: parentId || '', path: TYPST_DEV_ROOT, name: 'Typst'
            })).catch(function () {});
        }

        "Spawn a child session from the split radial: terminal/SSH become a split pane; chat/browser become child tabs."
        function spawnSplitSession(kind, opts) {
            opts = opts || {};
            const parentSid = activeChatId ||
                (terminals[activeTerminalId] || {}).juliaId || CHAT_SESSION_ID || '';
            if (kind === 'chat') {
                callJulia('flootyNewChildChat', JSON.stringify({
                    parent_id: parentSid, name: 'Chat'
                })).catch(function () {});
                return;
            }
            if (kind === 'browser') {
                flootyPrompt('URL', 'https://example.com', 'https://example.com')
                    .then(function (url) {
                        callJulia('flootyNewBrowserSession', JSON.stringify({
                            parent_id: parentSid, url: url || 'about:blank',
                            name: 'browser'
                        })).catch(function () {});
                    });
                return;
            }
            if (kind === 'pdf') {
                callJulia('flootyNewPdfSession', JSON.stringify({
                    parent_id: parentSid, path: '/viewer/index.html', name: 'PDF'
                })).catch(function () {});
                return;
            }
            if (kind === 'typst') {
                spawnTypstSession(parentSid);
                return;
            }
            if (kind === 'filetree') {
                spawnFileTreeSession(parentSid);
                return;
            }
            let parentId = null;
            if (activeTerminalId && terminals[activeTerminalId]) {
                // A split child selected in the tree is a valid NESTED parent.
                parentId = activeTerminalId;
            } else {
                parentId = Object.keys(terminals).find(function (k) {
                    return !terminals[k].splitParent;
                }) || null;
            }
            if (parentId) {
                if (activeChatId || activeBrowserId || activeTerminalId !== parentId) {
                    switchToTerminal(parentId);
                }
                splitTerminal(sessionChooserOrientation, Object.assign({}, opts,
                    { parentId: parentId }));
                return;
            }
            // No arena parent yet: the first terminal becomes the virtual
            // parent node (left seat); the next sibling splits beside it.
            createTerminal(Object.assign({}, opts,
                { name: opts.name || ('session ' + terminalCounter++) }));
        }

        "Spawn a SIBLING: same parent as the active node; a root node gets a root peer."
        function spawnSiblingSession(kind, opts) {
            opts = opts || {};
            const all = tabEntries();
            const entry = currentEntry(all);
            const parent = entry ? (entry.parent || null) : null;
            const rootSpawn = function () {
                if (kind === 'terminal') {
                    createTerminal(Object.assign({}, opts,
                        { name: opts.name || ('session ' + terminalCounter++) }));
                } else if (kind === 'ssh') {
                    // The caller may already have prompted (sibling radial).
                    if (opts.remote && String(opts.remote).trim()) {
                        const target = String(opts.remote).trim();
                        createTerminal(Object.assign({}, opts,
                            { name: opts.name || ('ssh ' + target), kind: 'ssh',
                              remote: target, sshCmd: opts.sshCmd || ('ssh ' + target) }));
                    } else {
                        flootyPrompt('SSH target (user@host)', 'user@host', sshTargetHistory()[0] || '', sshTargetHistory())
                            .then(function (target) {
                                if (!target) return;
                                createTerminal({ name: 'ssh ' + target, kind: 'ssh',
                                                 remote: target, sshCmd: 'ssh ' + target });
                            });
                    }
                } else if (kind === 'chat') {
                    callJulia('flootyNewRootChat',
                              JSON.stringify({ name: 'Chat' })).catch(function () {});
                } else if (kind === 'browser') {
                    flootyPrompt('URL', 'https://example.com', 'https://example.com')
                        .then(function (url) {
                            callJulia('flootyNewBrowserSession', JSON.stringify({
                                parent_id: '', url: url || 'about:blank', name: 'browser'
                            })).catch(function () {});
                        });
                } else if (kind === 'pdf') {
                    callJulia('flootyNewPdfSession', JSON.stringify({
                        parent_id: '', path: '/viewer/index.html', name: 'PDF'
                    })).catch(function () {});
                } else if (kind === 'typst') {
                    spawnTypstSession('');
                } else if (kind === 'filetree') {
                    spawnFileTreeSession('');
                }
            };
            if (!parent) {
                // Root chat / root terminal / root browser: choose a ROOT peer.
                rootSpawn();
                return;
            }
            if (kind === 'chat') {
                callJulia('flootyNewChildChat', JSON.stringify({
                    parent_id: parent, name: 'Chat'
                })).catch(function () {});
                return;
            }
            if (kind === 'browser') {
                flootyPrompt('URL', 'https://example.com', 'https://example.com')
                    .then(function (url) {
                        callJulia('flootyNewBrowserSession', JSON.stringify({
                            parent_id: parent, url: url || 'about:blank',
                            name: 'browser'
                        })).catch(function () {});
                    });
                return;
            }
            if (kind === 'pdf') {
                callJulia('flootyNewPdfSession', JSON.stringify({
                    parent_id: parent, path: '/viewer/index.html', name: 'PDF'
                })).catch(function () {});
                return;
            }
            if (kind === 'typst') {
                spawnTypstSession(parent);
                return;
            }
            if (kind === 'filetree') {
                spawnFileTreeSession(parent);
                return;
            }
            // Terminal/SSH sibling: if the parent is a pane, add it as another
            // split child; otherwise create the child session (tree map).
            let parentTab = null;
            for (const [tid, info] of Object.entries(terminals)) {
                if (info.juliaId === parent && !info.splitParent) parentTab = tid;
            }
            if (parentTab) {
                switchToTerminal(parentTab);
                splitTerminal('vertical', Object.assign({}, opts,
                    { parentId: parentTab }));
            } else {
                createTerminal(Object.assign({}, opts,
                    { parentSession: parent,
                      name: opts.name || ('session ' + terminalCounter++) }));
            }
        }

        function chooseSession(kind) {
            const mode = sessionChooserMode;
            closeSessionChooser();
            if (kind === 'cancel') return;
            if (kind === 'settings') { toggleSettingsPanel(true); return; }
            if (mode === 'split') {
                if (kind === 'ssh') {
                    flootyPrompt('SSH target (user@host)', 'user@host', sshTargetHistory()[0] || '', sshTargetHistory())
                        .then(function (target) {
                            if (!target) return;
                            spawnSplitSession('ssh', { name: 'ssh ' + target,
                                kind: 'ssh', remote: target,
                                sshCmd: 'ssh ' + target });
                        });
                } else {
                    spawnSplitSession(kind === 'split' ? 'terminal' : kind,
                        { name: kind === 'ssh' ? 'ssh' : undefined });
                }
                return;
            }
            if (mode === 'sibling') {
                if (kind === 'ssh') {
                    flootyPrompt('SSH target (user@host)', 'user@host', sshTargetHistory()[0] || '', sshTargetHistory())
                        .then(function (target) {
                            if (!target) return;
                            spawnSiblingSession('ssh', { name: 'ssh ' + target,
                                kind: 'ssh', remote: target,
                                sshCmd: 'ssh ' + target });
                        });
                } else {
                    spawnSiblingSession(kind === 'split' ? 'terminal' : kind, {});
                }
                return;
            }
            if (mode === 'root') {
                if (kind === 'browser') {
                    flootyPrompt('URL', 'https://example.com', 'https://example.com')
                        .then(function (url) {
                            callJulia('flootyNewBrowserSession', JSON.stringify({
                                parent_id: '', url: url || 'about:blank', name: 'browser'
                            })).catch(function () {});
                        });
                } else if (kind === 'pdf') {
                    callJulia('flootyNewPdfSession', JSON.stringify({
                        parent_id: '', path: '/viewer/index.html', name: 'PDF'
                    })).catch(function () {});
                } else if (kind === 'typst') {
                    spawnTypstSession('');
                } else if (kind === 'filetree') {
                    spawnFileTreeSession('');
                } else if (kind === 'ssh') {
                    flootyPrompt('SSH target (user@host)', 'user@host', sshTargetHistory()[0] || '', sshTargetHistory())
                        .then(function (target) {
                            if (!target) return;
                            createTerminal({ name: 'ssh ' + target,
                                             kind: 'ssh', remote: target,
                                             sshCmd: 'ssh ' + target });
                        });
                } else if (kind === 'terminal') {
                    createTerminal({ name: 'terminal' });
                } else if (kind === 'chat') {
                    callJulia('flootyNewRootChat',
                              JSON.stringify({ name: 'Chat' })).catch(function () {});
                }
                return;
            }
            const parentSid = activeChatId ||
                (terminals[activeTerminalId] || {}).juliaId || CHAT_SESSION_ID || '';
            if (kind === 'browser') {
                flootyPrompt('URL', 'https://example.com', 'https://example.com')
                    .then(function (url) {
                        callJulia('flootyNewBrowserSession', JSON.stringify({
                            parent_id: parentSid, url: url || 'about:blank', name: 'browser'
                        })).catch(function () {});
                    });
            } else if (kind === 'pdf') {
                callJulia('flootyNewPdfSession', JSON.stringify({
                    parent_id: parentSid, path: '/viewer/index.html', name: 'PDF'
                })).catch(function () {});
            } else if (kind === 'typst') {
                spawnTypstSession(parentSid);
            } else if (kind === 'filetree') {
                spawnFileTreeSession(parentSid);
            } else if (kind === 'ssh') {
                flootyPrompt('SSH target (user@host)', 'user@host', sshTargetHistory()[0] || '', sshTargetHistory())
                    .then(function (target) {
                        if (!target) return;
                        createTerminal({ parentSession: parentSid,
                                         name: 'ssh ' + target,
                                         kind: 'ssh', remote: target,
                                         sshCmd: 'ssh ' + target });
                    });
            } else if (kind === 'terminal') {
                createTerminal({ parentSession: parentSid,
                                 name: 'child ' + terminalCounter++ });
            } else if (kind === 'split') {
                if (activeChatId && activeTerminalId) switchToTerminal(activeTerminalId);
                splitTerminal();
            } else if (kind === 'chat') {
                callJulia('flootyNewChildChat',
                          JSON.stringify({ parent_id: parentSid,
                                           name: 'Chat' })).catch(function () {});
            }
            return undefined;
        }
        (function installBrowserBar() {
            const go = document.getElementById('browserGo');
            const input = document.getElementById('browserUrl');
            if (go) go.addEventListener('click', function () {
                const url = (input && input.value || '').trim();
                if (url) browserNavigateActive(url);
            });
            if (input) input.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') {
                    const url = String(input.value || '').trim();
                    if (url) browserNavigateActive(url);
                }
            });
        })();

        (function installSessionChooser() {
            const el = document.getElementById('sessionChooser');
            if (!el) return;
            el.querySelectorAll('[data-session-kind]').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    chooseSession(btn.dataset.sessionKind);
                });
            });
            el.addEventListener('click', function (e) {
                if (e.target === el) closeSessionChooser();
            });
            document.addEventListener('keydown', function (e) {
                if (!el.hidden && e.key === 'Escape') {
                    e.preventDefault();
                    e.stopPropagation();
                    closeSessionChooser();
                }
            }, true);
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape') closeSessionChooser();
            });
        })();

        // Make sure the first terminal fits even before any resize/click event.
        setTimeout(forceFitActive, 100);
        setTimeout(forceFitActive, 500);
        window.addEventListener('load', () => { setTimeout(forceFitActive, 50); setTimeout(forceFitActive, 300); });

        // Alt+D / Alt+Shift+D in the CAPTURE phase: macOS Option+D yields the
        // character "∂" (Option+Shift+D "Î"), so key-based matching missed it;
        // `code` is stable. Capture also wins over xterm/CodeMirror.1
        document.addEventListener('keydown', function (e) {
            if (!e.altKey || (e.code !== 'KeyD' &&
                !['d', 'D', '∂', 'Î'].includes(e.key))) return;
            e.preventDefault();
            e.stopPropagation();
            // Split shortcut opens the radial type chooser; the chosen session
            // is spawned as a CHILD (terminal/SSH as a split pane).
            openSessionChooser('split', e.shiftKey ? 'horizontal' : 'vertical');
        }, true);

        document.addEventListener('keydown', (e) => {
            // Ctrl+, / Cmd+,: toggle the settings pane.
            if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key === ',') {
                e.preventDefault();
                toggleSettingsPanel();
            }
            // Ctrl+Shift+T: spawn a SIBLING child of the current arena parent
            // (virtual parent = first terminal when none exists yet).
            if (e.ctrlKey && e.shiftKey && (e.key === 'T' || e.key === 't')) {
                e.preventDefault();
                openSessionChooser('sibling');
            }
            // Ctrl+Shift+R remains the NEW ROOT chooser.
            if (e.ctrlKey && e.shiftKey && (e.key === 'R' || e.key === 'r')) {
                e.preventDefault();
                openSessionChooser('root');
            }
            // Ctrl+Shift+O: session tree map (no permanent top tabs).
            if (e.ctrlKey && e.shiftKey && (e.key === 'O' || e.key === 'o')) {
                e.preventDefault();
                toggleTreeMap();
            }

            // Ctrl+Shift+W: close the ACTIVE session, not the first/last
            // terminal left over while a chat tab is focused.
            if (e.ctrlKey && e.shiftKey &&
                (e.key === 'W' || e.key === 'w' || e.code === 'KeyW')) {
                e.preventDefault();
                closeActiveSession();
            }

        });
    </script>

    <script type="module">
        import { mountPdfLayer } from '/viewer/layer.mjs';
        import { mountEditorLayer } from '/editor/layer.mjs';
        const typstEditorHost = document.getElementById('typstEditorHost');
        const typstPdfHost = document.getElementById('typstPdfHost');
        window.editorLayer = mountEditorLayer(typstEditorHost);
        window.typstPdfLayer = mountPdfLayer(typstPdfHost);
        window.pdfLayer = mountPdfLayer(document.getElementById('pdfLayerHost'));
    </script>

    <script type="module">
        // Same markdown stack as FlootyApp (micromark + GFM), vendored locally in
        // libs/. micromark escapes raw HTML unless allowDangerousHtml is set, and we
        // never set it — so agent text can format itself, never inject markup.
        import { micromark } from './libs/micromark.bundle.mjs';
        import { gfm, gfmHtml } from './libs/micromark-gfm.bundle.mjs';
        window.micromark = micromark;
        window.micromarkGfm = { gfm: gfm, gfmHtml: gfmHtml };
        window.dispatchEvent(new Event('flootyMarkdownReady'));
    </script>
