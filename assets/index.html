            });
            const stop = (e) => {
                if (!dragging) return;
                dragging = false;
                grip.classList.remove('dragging');
                const panel = document.getElementById('thinkingPanel');
                panel && setChatWidth(panel.getBoundingClientRect().width, true);
                try { grip.releasePointerCapture(e.pointerId); } catch (err) {}
            };
            grip.addEventListener('pointerup', stop);
            grip.addEventListener('pointercancel', stop);
            grip.addEventListener('dblclick', () => setChatWidth(340, true));
        })();

        // ---- child terminals (split panes) ---------------------------------
        // A bounded pool (SPLIT_MAX) of temporary children PER TAB. Pools survive
        // tab switches: switching away hides the children, switching back shows
        // them; closing the tab closes its pool.
        const SPLIT_MAX = 2;
        const splitPools = Object.create(null);   // parent tab id -> [child ids]
        const splitOrientations = Object.create(null); // parent tab id -> vertical|horizontal

        function splitPool(parentId) {
            if (!parentId) return [];
            const ids = splitPools[parentId] || [];
            const live = ids.filter(id => !!terminals[id]);
            if (live.length) splitPools[parentId] = live;
            else delete splitPools[parentId];
            return live;
        }
        function activeSplitPool() {
            return activeTerminalId ? splitPool(activeTerminalId) : [];
        }

        function applySplitLayout() {
            const container = document.getElementById('terminal-container');
            if (!container) return;
            const kids = activeSplitPool();
            const showsSplit = kids.length > 0;
            const parentId = activeTerminalId;
            container.classList.toggle('split', showsSplit);
            // Orientation is no longer a presentation choice: parent left,
            // children always stacked on the right.
            container.classList.remove('split-horizontal', 'split-vertical');
            for (const [tid, info] of Object.entries(terminals)) {
                const el = document.getElementById(tid);
                if (!el) continue;
                const isSplitPanel = !!info.splitParent && tid !== parentId;
                el.classList.toggle('split-child', isSplitPanel);
                el.classList.remove('split-child-second');
                el.style.gridColumn = '';
                el.style.gridRow = '';
                if (isSplitPanel) {
                    const visible = info.splitParent === parentId &&
                                    kids.includes(tid);
                    el.style.display = visible ? 'block' : 'none';
                } else if (tid !== parentId) {
                    el.style.display = '';
                }
            }
            if (showsSplit && parentId && terminals[parentId]) {
                const parentEl = document.getElementById(parentId);
                if (parentEl) {
                    parentEl.style.gridColumn = '1';
                    parentEl.style.gridRow = '1 / span 2';
                }
                kids.forEach(function (tid, i) {
                    const el = document.getElementById(tid);
                    if (!el) return;
                    el.style.gridColumn = '2';
                    el.style.gridRow = kids.length === 1 ? '1 / span 2' : String(i + 1);
                    if (i > 0) el.classList.add('split-child-second');
                });
            }
            const ids = [activeTerminalId].concat(kids);
            const fit = (id) => {
                const info = terminals[id];
                if (!info) return;
                try { info.fitAddon.fit(); } catch (e) {}
                if (info.juliaId) {
                    try { sendTerminalResize(info); } catch (e) {}
                }
            };
            setTimeout(() => ids.forEach(fit), showsSplit ? 0 : 1);
            setTimeout(() => ids.forEach(fit), showsSplit ? 120 : 140);
            renderTabRail();
            return container.classList.contains('split');
        }

        "Split the active tab (vertical default); returns the child tab id."
        function splitTerminal(orientation, opts) {
            opts = opts || {};
            const parentId = opts.parentId || activeTerminalId;
            if (!parentId || !terminals[parentId]) return null;
            splitOrientations[parentId] =
                orientation === 'horizontal' ? 'horizontal' : 'vertical';
            const kids = splitPool(parentId);
            if (kids.length >= SPLIT_MAX) {
                const last = kids[kids.length - 1];
                try { terminals[last].term.focus(); } catch (e) {}
                return last;
            }
            const before = new Set(Object.keys(terminals));
            const parentSid = (terminals[parentId] || {}).juliaId || '';
            createTerminal({ noTab: true, splitParent: parentId,
                             parentSession: parentSid,
                             name: opts.name || ('child ' + terminalCounter++),
                             kind: opts.kind, remote: opts.remote,
                             sshCmd: opts.sshCmd });
            const created = Object.keys(terminals).find(id => !before.has(id));
            if (!created) return null;
            splitPools[parentId] = kids.concat([created]);
            applySplitLayout();
            try { window.flootyDebug && window.flootyDebug('split terminal ' + created); } catch (e) {}
            return created;
        }

        "Close the children of the tab that owns a Julia session id."
        window.flootyCloseChildTerminalFor = function (parentSid) {
            for (const [tid, info] of Object.entries(terminals)) {
                if (!parentSid || info.juliaId === parentSid) {
                    const ids = (splitPools[tid] || []).slice();
                    delete splitPools[tid];
                    for (const id of ids) {
                        try { closeTerminal(id); } catch (e) {}
                    }
                    applySplitLayout();
                    return ids.length;
                }
            }
            return 0;
        };

        "Close ALL children of the ACTIVE tab (keeps the parent and tabs)."
        function closeChildTerminal() {
            const sid = (terminals[activeTerminalId] || {}).juliaId || '';
            return window.flootyCloseChildTerminalFor(sid);
        }

        window.flootySplitTerminal = function (orientation) {
            return splitTerminal(orientation);
        };
        window.flootyCloseChildTerminal = closeChildTerminal;

        function createTerminal(opts) {
            opts = opts || {};
            const terminalId = (opts.idHint || 'term-') + Date.now() +
                               (opts.noTab ? '-child' : '');
            const terminalName = opts.name || ('terminal ' + terminalCounter++);

            const term = new Terminal({
                fontSize: 13,
                fontFamily: 'Menlo, Consolas, "Courier New", monospace',
                theme: xtermTheme(),
                cursorBlink: true,
                cursorStyle: 'bar',
                scrollback: 10000
            });

            const panel = document.createElement('div');
            panel.className = 'terminal-panel';
            panel.id = terminalId;
            document.getElementById('terminal-container').appendChild(panel);

            term.open(panel);

            const fitAddon = new FitAddon.FitAddon();
            term.loadAddon(fitAddon);
            setTimeout(() => { try { fitAddon.fit(); } catch (e) {} }, 0);

            // GPU renderer (WebGL2). Falls back to xterm's DOM renderer when
            // the GPU path is unavailable — the terminal still works.
            const gpu = enableGpuRenderer(term);

            // SSH sessions: the command and remote target are inherited by
            // every child terminal (new tab, split, or agent-spawned).
            const parentInfo = opts.parentSession ? (function () {
                for (const [, t] of Object.entries(terminals)) {
                    if (t.juliaId === opts.parentSession) return t;
                }
                return null;
            })() : null;
            const kind = opts.kind || (parentInfo && parentInfo.kind) || 'terminal';
            const remote = opts.remote || (parentInfo && parentInfo.remote) || '';
            const sshCmd = opts.sshCmd || (parentInfo && parentInfo.sshCmd) ||
                (kind === 'ssh' && remote ? 'ssh ' + remote : '');
            kind === 'ssh' && remote && rememberSshTarget(remote);
            terminals[terminalId] = {
                term: term,
                fitAddon: fitAddon,
                gpu: gpu,
                name: terminalName,
                juliaId: null,
                exited: false,
                kind: kind,
                remote: remote,
                sshCmd: sshCmd,
                splitParent: opts.splitParent || null,
                parentSession: opts.parentSession || null,
                chatStream: 'agent',
                terminalMonitorChat: [],
                trajectoryMonitorChat: [],
                preferencesMonitorChat: [],
                popups: []          // THIS session's live feedback popups
            };

            // A CHILD terminal has NO tab: it lives inside the parent tab's pane
            // area as the right half of a split, and disappears with that tab.
            if (!opts.noTab) {
                // FIRST tab: take over the chat-only conversation so the rail
                // keeps the thread the user already had with the agent. Do this
                // BEFORE createTab: the rail's synthetic root chat would make
                // chatTabs non-empty and defeat the migration.
                if (Object.keys(terminals).length === 1 &&
                    Object.keys(chatTabs).length === 0 &&
                    (CHAT_ONLY.chat.length || CHAT_ONLY.monitorChat.length)) {
                    terminals[terminalId].chat = CHAT_ONLY.chat;
                    terminals[terminalId].monitorChat = CHAT_ONLY.monitorChat;
                if (CHAT_ONLY.trajectoryMonitorChat)
                    terminals[terminalId].trajectoryMonitorChat = CHAT_ONLY.trajectoryMonitorChat;
                if (CHAT_ONLY.preferencesMonitorChat)
                    terminals[terminalId].preferencesMonitorChat =
                        CHAT_ONLY.preferencesMonitorChat;
                    if (CHAT_ONLY.trajectoryMonitorChat)
                        terminals[terminalId].trajectoryMonitorChat = CHAT_ONLY.trajectoryMonitorChat;
                    if (CHAT_ONLY.preferencesMonitorChat)
                        terminals[terminalId].preferencesMonitorChat =
                            CHAT_ONLY.preferencesMonitorChat;
                    terminals[terminalId].chatStream = CHAT_ONLY.chatStream || 'agent';
                    if (CHAT_ONLY.contextTokens !== undefined) {
                        terminals[terminalId].contextTokens = CHAT_ONLY.contextTokens;
                        terminals[terminalId].contextLimit = CHAT_ONLY.contextLimit || 0;
                    }
                    CHAT_ONLY.chat = [];
                    CHAT_ONLY.monitorChat = [];
                }
                createTab(terminalId, terminalName);
                switchToTerminal(terminalId);
            }

            // xterm focus debugging: clicks on the pane must focus xterm's
            // hidden helper textarea; log everything relevant to stdout.
            const dbg = m => { try { window.flootyDebug && window.flootyDebug(m); } catch (e) {} };
            panel.addEventListener('mousedown', () => {
                dbg('pane-mousedown ' + terminalId);
                setTimeout(() => { term.focus(); dbg('pane-refocused ' + terminalId); }, 0);
            });
            setTimeout(() => {
                const ta = panel.querySelector('.xterm-helper-textarea');
                const r = ta ? ta.getBoundingClientRect() : null;
                dbg('textarea=' + (ta ? 'present' : 'MISSING') +
                    ' rect=' + (r ? Math.round(r.width) + 'x' + Math.round(r.height) : '-'));
            }, 800);

            wireTerminalInput(terminalId);

            reportGpuState();

            createJuliaTerminal(terminalId);
            updateLayoutMode();
        }

        // Adopt an EXISTING backend terminal (e.g. the session the agent is
        // driving). Same tab/panel/xterm plumbing as createTerminal(), but
        // bound to a juliaId that already exists — no terminal_create call,
        // so NO process is spawned. Output arrives via handleTerminalOutput,
        // which fans chunks out to EVERY tab bound to that id: adopting the
        // same session twice gives a user view AND an agent view of ONE PTY.
        // `view` is 'agent' | 'user' — a cosmetic marker for focus reporting.
        function adoptTerminal(juliaId, name, replayText, view, parentSession) {
            // Duplicate-attach guard: a tab already bound to this PTY id is
            // FOCUSED instead of re-created — two tabs sharing one process
            // meant closing either killed "the other" terminal.
            for (const [existingId, existing] of Object.entries(terminals)) {
                if (existing.juliaId === juliaId) {
                    switchToTerminal(existingId);
                    return;
                }
            }
            const terminalId = 'term-' + Date.now();
            const term = new Terminal({
                fontSize: 13,
                fontFamily: 'Menlo, Consolas, "Courier New", monospace',
                theme: xtermTheme(),
                cursorBlink: true,
                cursorStyle: 'bar',
                scrollback: 10000
            });
            const panel = document.createElement('div');
            panel.className = 'terminal-panel';
            panel.id = terminalId;
            document.getElementById('terminal-container').appendChild(panel);
            term.open(panel);
            const fitAddon = new FitAddon.FitAddon();
            term.loadAddon(fitAddon);
            // GPU renderer (WebGL2) — same path as createTerminal(), with the
            // same DOM fallback.
            const gpu = enableGpuRenderer(term);
            terminals[terminalId] = {
                term: term,
                fitAddon: fitAddon,
                gpu: gpu,
                name: name || 'julia',
                juliaId: juliaId,
                view: view || 'agent',
                parentSession: parentSession || null,
                kind: 'terminal',
                chatStream: 'agent',
                terminalMonitorChat: [],
                trajectoryMonitorChat: [],
                preferencesMonitorChat: [],
                exited: false,
                popups: []          // THIS session's live feedback popups
            };
            // The data-plane channel for this session (the PTY bytes travel
            // over the binary socket instead of a per-chunk eval).
            openChannel(juliaId, term);
            // Seed with pre-adoption history so the tab is never blank.
            if (replayText) {
                term.write(replayText);
            }
            // The chat-launched FIRST terminal adopts the chat-only rail WHOLE:
            // both the agent thread and the monitor stream. Without this the
            // Monitor tab of the new tab was empty while CHAT_ONLY's monitor
            // messages were stranded off-screen.
            if (Object.keys(terminals).length === 1 &&
                Object.keys(chatTabs).length === 0 &&
                (CHAT_ONLY.chat.length || CHAT_ONLY.monitorChat.length)) {
                terminals[terminalId].chat = CHAT_ONLY.chat;
                terminals[terminalId].monitorChat = CHAT_ONLY.monitorChat;
                if (CHAT_ONLY.trajectoryMonitorChat)
                    terminals[terminalId].trajectoryMonitorChat = CHAT_ONLY.trajectoryMonitorChat;
                if (CHAT_ONLY.preferencesMonitorChat)
                    terminals[terminalId].preferencesMonitorChat =
                        CHAT_ONLY.preferencesMonitorChat;
                terminals[terminalId].chatStream = CHAT_ONLY.chatStream || 'agent';
                if (CHAT_ONLY.contextTokens !== undefined) {
                    terminals[terminalId].contextTokens = CHAT_ONLY.contextTokens;
                    terminals[terminalId].contextLimit = CHAT_ONLY.contextLimit || 0;
                }
                CHAT_ONLY.chat = [];
                CHAT_ONLY.monitorChat = [];
            }
            panel.addEventListener('mousedown', () => {
                term.focus();
                setTimeout(() => { try { term.focus(); } catch (e) {} }, 0);
            });
            createTab(terminalId, terminals[terminalId].name);
            switchToTerminal(terminalId);
            wireTerminalInput(terminalId);      // CRITICAL: adopted tabs must accept typing too
            reportGpuState();
            // Drain chunks that arrived for this juliaId BEFORE the tab bound
            // (the backend streams adopted sessions live; these raced the
            // bind). Mirrors createJuliaTerminal's bind-time drain.
            try {
                const queued = pendingOutput[juliaId];
                if (queued) {
                    delete pendingOutput[juliaId];
                    for (const c of queued) terminals[terminalId].term.write(c);
                }
                window.__lastAdoptDrain = { id: juliaId,
                    drained: queued ? queued.length : 0 };
            } catch (e) {
                try { window.flootyDebug && window.flootyDebug(
                    'ADOPT_DRAIN_ERROR ' + e); } catch (_e) {}
            }
            updateLayoutMode();
        }

        // The tab rail is a TREE: root sessions at level 0, child sessions
        // (terminal tabs, chat tabs, split panes) indented under their parent.
        let activeSplitId = null;

        function createTab(terminalId, name) {
            renderTabRail();
        }

        function createChatTab(id, name) {
            renderTabRail();
        }

        function tabEntries() {
            // The root chat is always a root icon once any session exists.
            if (CHAT_SESSION_ID &&
                (Object.keys(terminals).length || Object.keys(chatTabs).length ||
                 Object.keys(browserTabs).length)) {
                if (!chatTabs[CHAT_SESSION_ID]) {
                    CHAT_ONLY.name = 'Chat';
                    CHAT_ONLY.kind = 'chat';
                    chatTabs[CHAT_SESSION_ID] = CHAT_ONLY;
                }
            }
            const out = [];
            for (const [tid, info] of Object.entries(terminals)) {
                if (info.splitParent) continue;   // panes are nested rows
                out.push({ key: tid, kind: 'terminal', name: info.name || tid,
                           sid: info.juliaId || '', parent: info.parentSession || null,
                           xterm: tid, info: info });
            }
            for (const [id, info] of Object.entries(chatTabs)) {
                out.push({ key: 'chat-' + id, kind: 'chat', name: info.name || 'Chat',
                           sid: id, parent: info.parent || null, chat: id, info: info });
            }
            for (const [id, info] of Object.entries(browserTabs)) {
                out.push({ key: 'browser-' + id, kind: 'browser',
                           name: info.name || 'browser', sid: id,
                           parent: info.parent || null, browser: id, info: info });
            }
            for (const [tid, info] of Object.entries(terminals)) {
                if (!info.splitParent) continue;
                const pt = terminals[info.splitParent];
                out.push({ key: 'split-' + tid, kind: 'split', name: info.name || 'split',
                           sid: info.juliaId || '',
                           parent: pt ? (pt.juliaId || '') : null,
                           xterm: tid, parentTab: info.splitParent, info: info });
            }
            return out;
        }

        function currentEntry(all) {
            if (activeBrowserId)
                return all.find(e => e.kind === 'browser' && e.browser === activeBrowserId);
            if (activeChatId)
                return all.find(e => e.kind === 'chat' && e.chat === activeChatId);
            if (activeSplitId)
                return all.find(e => e.kind === 'split' && e.sid === activeSplitId);
            if (activeTerminalId)
                return all.find(e => e.kind === 'terminal' && e.xterm === activeTerminalId);
            return all.find(e => e.kind === 'chat' && e.chat === CHAT_SESSION_ID) ||
                   all[0] || null;
        }

        function chainOf(e, all) {
            const bySid = new Map(all.filter(x => x.sid).map(x => [x.sid, x]));
            const chain = [];
            const seen = new Set();
            let cur = e;
            while (cur && !seen.has(cur.sid)) {
                chain.unshift(cur);
                seen.add(cur.sid);
                cur = cur.parent ? bySid.get(cur.parent) : null;
            }
            return chain;
        }

        function rootOf(e, all) {
            const chain = chainOf(e, all);
            return chain.length ? chain[0] : e;
        }

        function busyOf(e) {
            const info = e.info || {};
            return !!(info.progress || info.toolBusy || info.busy);
        }

        function glyphOf(e) {
            if (e.kind === 'terminal')
                return (e.info && e.info.kind === 'ssh') ? 'S' : '>_';
            if (e.kind === 'browser') {
                const url = String((e.info && e.info.url) || '');
                if (url.startsWith('filetree:')) return 'F';
                if (url.includes('/viewer/')) return 'P';
                if (url.includes('typst:')) return 'Y';
                return 'B';
            }
            return e.kind === 'chat' ? 'C' : '?';
        }

        function activateEntry(e) {
            if (e.kind === 'browser') return activateBrowserTab(e.browser);
            if (e.kind === 'chat') return activateChatTab(e.chat);
            if (e.kind === 'terminal') return switchToTerminal(e.xterm);
            if (e.kind === 'split') {
                // Chat belongs to the arena PARENT (left). Selecting a sibling
                // focuses it without moving that association.
                switchToTerminal(e.parentTab);
                activeSplitId = e.sid;
                renderTabRail();
                try { e.info.term.focus(); } catch (err) {}
                return undefined;
            }
            return undefined;
        }

        function renderRootRail() {
            const rail = document.getElementById('terminal-tabs');
            if (!rail) return;
            rail.textContent = '';
            const all = tabEntries();
            const sids = new Set(all.map(e => e.sid).filter(Boolean));
            const roots = all.filter(e => !e.parent || !sids.has(e.parent));
            const active = currentEntry(all);
            const activeRoot = active ? rootOf(active, all) : null;
            for (const r of roots) {
                const el = document.createElement('div');
                el.className = 'root-icon' + (r === activeRoot ? ' active' : '');
                el.id = 'root-' + r.key;
                el.title = r.name;
                const glyph = document.createElement('span');
                glyph.className = 'glyph';
                glyph.textContent = glyphOf(r);
                el.appendChild(glyph);
                if (busyOf(r)) {
                    const d = document.createElement('span');
                    d.className = 'dot';
                    el.appendChild(d);
                }
                if (r.kind === 'chat' && r.chat !== CHAT_SESSION_ID) {
                    const close = document.createElement('span');
                    close.className = 'close-btn';
                    close.textContent = '×';
                    close.onclick = function (ev) {
                        ev.stopPropagation();
                        closeChatSession(r.chat);
                    };
                    el.appendChild(close);
                }
                el.onclick = function () { activateEntry(r); };
                rail.appendChild(el);
            }
            const mapBtn = document.createElement('div');
            mapBtn.className = 'root-icon tree-map-btn';
            mapBtn.id = 'treeMapBtn';
            mapBtn.title = 'Session tree (Ctrl+Shift+O)';
            mapBtn.textContent = '☰';
            mapBtn.onclick = function (e) {
                e.stopPropagation();
                toggleTreeMap();
            };
            rail.appendChild(mapBtn);
            const settingsBtn = document.createElement('div');
            settingsBtn.className = 'root-icon settings-btn';
            settingsBtn.id = 'settingsBtn';
            settingsBtn.title = 'Settings (Ctrl+,)';
            settingsBtn.textContent = '⚙';
            settingsBtn.onclick = function (e) {
                e.stopPropagation();
                toggleSettingsPanel();
            };
            rail.appendChild(settingsBtn);
            return undefined;
        }

        function childTabNode(e, active, self) {
            const tab = document.createElement('div');
            tab.className = 'child-tab' + (active ? ' active' : '');
            tab.id = 'child-tab-' + e.key;
            tab.title = e.name;
            const glyph = document.createElement('span');
            glyph.textContent = glyphOf(e);
            tab.appendChild(glyph);
            const name = document.createElement('span');
            name.textContent = e.name;
            tab.appendChild(name);
            if (busyOf(e)) {
                const d = document.createElement('span');
                d.className = 'dot';
                tab.appendChild(d);
            }
            if (e.kind === 'terminal') {
                const close = document.createElement('span');
                close.className = 'close-btn';
                close.textContent = '×';
                close.onclick = function (ev) {
                    ev.stopPropagation();
                    closeTerminal(e.xterm);
                };
                tab.appendChild(close);
            } else if (e.kind === 'chat' && e.chat !== CHAT_SESSION_ID) {
                const close = document.createElement('span');
                close.className = 'close-btn';
                close.textContent = '×';
                close.onclick = function (ev) {
                    ev.stopPropagation();
                    closeChatSession(e.chat);
                };
                tab.appendChild(close);
            }
            tab.onclick = function () { activateEntry(e); };
            return tab;
        }

        function renderChildStrips() {
            const host = document.getElementById('childTabs');
            if (!host) return;
            host.textContent = '';
            const all = tabEntries();
            const active = currentEntry(all);
            if (!active) return;
            if (host.classList.contains('tree-map-open')) {
                // FULL tree map: every session, not just the active path.
                const ordered = orderedEntries();
                for (const e of ordered) {
                    const row = document.createElement('div');
                    row.className = 'child-strip';
                    row.appendChild(childTabNode(e, e === active, false));
                    host.appendChild(row);
                }
                return;
            }
            const chain = chainOf(active, all);
            for (let i = 0; i < chain.length; i++) {
                const node = chain[i];
                const kids = all.filter(e => e.parent === node.sid);
                if (!kids.length) continue;
                const strip = document.createElement('div');
                strip.className = 'child-strip';
                strip.appendChild(childTabNode(node, node === active, true));
                for (const k of kids) {
                    strip.appendChild(childTabNode(k, k === chain[i + 1], false));
                }
                host.appendChild(strip);
            }
            return undefined;
        }

        function renderTabRail() {
            renderRootRail();
            renderChildStrips();
            return undefined;
        }

        function orderedEntries() {
            const all = tabEntries();
            const sids = new Set(all.map(e => e.sid).filter(Boolean));
            const roots = all.filter(e => !e.parent || !sids.has(e.parent));
            const out = [];
            const seen = new Set();
            const walk = function (e) {
                if (!e || seen.has(e.key)) return;
                seen.add(e.key);
                out.push(e);
                all.filter(c => c.parent === e.sid).forEach(walk);
            };
            roots.forEach(walk);
            all.forEach(function (e) { if (!seen.has(e.key)) out.push(e); });
            return out;
        }

        function cycleTab(dir) {
            const ordered = orderedEntries();
            if (!ordered.length) return;
            const active = currentEntry(tabEntries());
            let idx = active ? ordered.findIndex(e => e.key === active.key) : -1;
            idx = (idx + dir + ordered.length) % ordered.length;
            activateEntry(ordered[idx]);
        }

        // Ctrl+Tab / Ctrl+Shift+Tab: cycle the session tree in creation order
        // (roots then their descendants). CAPTURE so xterm cannot eat Tab.
        document.addEventListener('keydown', function (e) {
            if (!e.ctrlKey || e.altKey || e.key !== 'Tab') return;
            e.preventDefault();
            e.stopPropagation();
            cycleTab(e.shiftKey ? -1 : 1);
        }, true);

        function switchToTerminal(terminalId) {
            if (!terminals[terminalId]) return;
            captureAssistDraft();
            activeChatId = null;
            activeBrowserId = null;
            activeSplitId = null;
            const _ws = document.querySelector('.workspace');
            _ws && _ws.classList.remove('chat-focus');
            _ws && _ws.classList.remove('browser-focus');
            deactivatePdfPane();
            document.querySelectorAll('.chat-tab').forEach(tab => {
                tab.classList.remove('active');
            });

            document.querySelectorAll('.terminal-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            const tabEl = document.getElementById('tab-' + terminalId);
            if (tabEl) tabEl.classList.add('active');

            document.querySelectorAll('.terminal-panel').forEach(panel => {
                panel.classList.remove('active');
            });
            const panelEl = document.getElementById(terminalId);
            if (panelEl) panelEl.classList.add('active');

            // The ASSIST BOX owns the caret (Warp-style single input surface);
            const _activeInfo = terminals[terminalId];
            setTimeout(() => { try { _activeInfo.fitAddon.fit(); } catch (e) {} }, 0);

            activeTerminalId = terminalId;
            restoreAssistDraft(terminals[terminalId]);
            updateStatusBar();
            renderActiveProgress();
            // Tell Julia which session's tab is ACTIVE so ownership actions
            // (pill/chip click, assist submit, user-typing yield, status
            // stream) hit THIS tab's session — one agent per session.
            const focusedId = terminals[terminalId].juliaId;
            if (focusedId) {
                callJulia('flootyTabFocused',
                          JSON.stringify({ terminal_id: focusedId }))
                    .catch(() => {});
                // Optimistic local repaint from stored state; the backend's
                // focus reply corrects us if this tab never got a push yet.
                renderActiveOwnership();
            }
            renderActivePopups();     // repaint THIS tab's popups + clear badge
            renderChatStreamTabs(terminals[terminalId]);
            renderActiveAgentChat();  // repaint THIS tab's chat transcript
            if (typeof refreshAgentModels === 'function') refreshAgentModels();
            scheduleTerminalBufferPush(terminals[terminalId]);
            if (typeof applySplitLayout === 'function') applySplitLayout();
            renderTabRail();
        }

        function closeTerminal(terminalId) {
            const info = terminals[terminalId];
            if (!info) return;

            if (info.juliaId && !info.exited) {
                killJuliaTerminal(info.juliaId, terminalId);
            }
            if (info.splitParent) {      // this split child is gone
                const parentTab = info.splitParent;
                const remaining = splitPool(parentTab).filter(id => id !== terminalId);
                if (remaining.length) splitPools[parentTab] = remaining;
                else delete splitPools[parentTab];
                if (info.juliaId) {
                    try {
                        callJulia('flootySplitClosed',
                                  JSON.stringify({ terminal_id: info.juliaId }))
                            .catch(function () {});
                    } catch (e) {}
                }
            }

            info.term.dispose();

            const panelEl = document.getElementById(terminalId);
            if (panelEl) panelEl.remove();
            const tabEl = document.getElementById('tab-' + terminalId);
            if (tabEl) tabEl.remove();

            // Closing the MAIN tab closes every child in its pool.
            {
                const kids = splitPool(terminalId);
                delete splitPools[terminalId];
                delete splitOrientations[terminalId];
                for (const childId of kids) {
                    try { closeTerminal(childId); } catch (e) {}
                }
            }
            delete terminals[terminalId];

            if (activeTerminalId === terminalId) {
                const remainingIds = Object.keys(terminals);
                if (remainingIds.length > 0) {
                    switchToTerminal(remainingIds[0]);
                } else {
                    activeTerminalId = null;
                }
            }
            updateStatusBar();
            updateLayoutMode();
            applySplitLayout();
            renderTabRail();
            reportGpuState();
        }

        "Drop a terminal's page state when the BACKEND already closed its PTY."
        function dropTerminalTab(terminalId) {
            const info = terminals[terminalId];
            if (!info) return;
            if (info.splitParent) {
                const parentTab = info.splitParent;
                const remaining = splitPool(parentTab).filter(id => id !== terminalId);
                if (remaining.length) splitPools[parentTab] = remaining;
                else delete splitPools[parentTab];
            }
            try { info.term.dispose(); } catch (e) {}
            const panelEl = document.getElementById(terminalId);
            if (panelEl) panelEl.remove();
            const tabEl = document.getElementById('tab-' + terminalId);
            if (tabEl) tabEl.remove();
            const kids = splitPool(terminalId) || [];
            delete splitPools[terminalId];
            delete splitOrientations[terminalId];
            for (const childId of kids) dropTerminalTab(childId);
            delete terminals[terminalId];
            if (activeTerminalId === terminalId) activeTerminalId = null;
            reportGpuState();
        }

        "Computer-use bridge: receives JS requests from the Julia debug pipe and replies via a bound Julia function."
        window.__computerUseRequest = async function (id, req) {
            const trace = m => { try { window.flootyFileDrop && window.flootyFileDrop('computer-use: ' + m); } catch (_) {} };
            trace('request received');
            try {
                const script = String(req && req.script || '');
                const value = await (0, eval)(script);
                callJulia('computerUseResult', JSON.stringify({ id: id, ok: true, result: value })).catch(e => trace('Julia callback failed: ' + e));
                trace('request ok');
            } catch (e) {
                callJulia('computerUseResult', JSON.stringify({ id: id, ok: false, error: e && e.message ? String(e.message) : String(e) })).catch(e2 => trace('Julia callback failed: ' + e2));
                trace('request error: ' + (e && e.message ? e.message : String(e)));
            }
        };

        "Computer-use: synthesize DOM mouse/keyboard events into the live page."
        "Computer-use: evaluate a JS expression and report result via callJulia(computerUseResult)."
        window.__computerUseEvaluate = async function (req) {
            const id = (req && req.id) || '';
            try {
                const script = String(req && req.script || '');
                const value = await (0, eval)(script);
                callJulia('computerUseResult', JSON.stringify({ id: id, ok: true, result: value })).catch(function (e) {
                    try { window.flootyFileDrop && window.flootyFileDrop('computerUseResult failed: ' + e); } catch (_) {}
                });
            } catch (e) {
                callJulia('computerUseResult', JSON.stringify({ id: id, ok: false, error: e && e.message ? String(e.message) : String(e) })).catch(function () {});
            }
        };

        window.__computerUseAct = function (action) {
            try {
                if (!action || !action.op) return;
                const param = action.params || {};
                if (action.op === 'mouse') {
                    const target = param.elementId ? document.getElementById(param.elementId)
                        : document.elementFromPoint(Number(param.x || 0), Number(param.y || 0));
                    if (!target) return;
                    const type = param.kind === 'down' ? 'mousedown' : param.kind === 'up' ? 'mouseup' : 'click';
                    target.dispatchEvent(new MouseEvent(type, {
                        clientX: Number(param.x || 0), clientY: Number(param.y || 0),
                        button: Number(param.button || 0), bubbles: true, cancelable: true, view: window
                    }));
                    if (param.kind === 'down') target.dispatchEvent(new MouseEvent('mouseup', { 
                        clientX: Number(param.x || 0), clientY: Number(param.y || 0),
                        button: Number(param.button || 0), bubbles: true, cancelable: true, view: window }));
                } else if (action.op === 'keyboard') {
                    const target = param.elementId ? document.getElementById(param.elementId)
                        : document.activeElement || document.body;
                    if (!target) return;
                    const ev = new KeyboardEvent('keydown', {
                        key: String(param.key || ''), bubbles: true, cancelable: true, view: window
                    });
                    target.dispatchEvent(ev);
                    if (param.text) {
                        const input = target;
                        if ('value' in input) {
                            const setter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value').set;
                            setter.call(input, (input.value || '') + param.text);
                            input.dispatchEvent(new Event('input', { bubbles: true }));
                        }
                    }
                } else if (action.op === 'evaluate') {
                    window.__computerUseRequest(action.id || 'eval', { script: String(param.script || '') });
                }
                callJulia('computerUseResult', JSON.stringify({ id: action.id, ok: true, result: null })).catch(function () {});
            } catch (e) {
                callJulia('computerUseResult', JSON.stringify({ id: action.id, ok: false, error: String(e && e.message ? e.message : e) })).catch(function () {});
            }
        };

        "Remove one session's UI after the backend closed it (and descendants)."
        "Remove one session's UI after the backend closed it (and descendants)."
        function removeSessionTab(id) {
            if (chatTabs[id]) {
                if (activeChatId === id) activeChatId = null;
                delete chatTabs[id];
            }
            if (browserTabs[id]) {
                if (activeBrowserId === id) activeBrowserId = null;
                delete browserTabs[id];
            }
            // Backend terminal ids are PTY/session ids; page tabs are `term-…`
            // and bind the session id as `info.juliaId`. Drop by either.
            for (const [tid, info] of Object.entries(terminals)) {
                if (tid === id || info.juliaId === id) dropTerminalTab(tid);
            }
        }

        "After closing the active session, show the nearest surviving session."
        function activateFallbackSession() {
            const t = activeTerminalId && terminals[activeTerminalId];
            const c = activeChatId && chatTabs[activeChatId];
            const b = activeBrowserId && browserTabs[activeBrowserId];
            if (t) { switchToTerminal(activeTerminalId); return; }
            if (c) { activateChatTab(activeChatId); return; }
            if (b) { activateBrowserTab(activeBrowserId); return; }
            activeTerminalId = null;
            activeChatId = null;
            activeBrowserId = null;
            const cid = (CHAT_SESSION_ID && chatTabs[CHAT_SESSION_ID]) ? CHAT_SESSION_ID
                       : Object.keys(chatTabs)[0];
            if (cid) { activateChatTab(cid); return; }
            const tid = Object.keys(terminals)[0];
            if (tid) { switchToTerminal(tid); return; }
            const bid = Object.keys(browserTabs)[0];
            if (bid) { activateBrowserTab(bid); return; }
            // Chat-only again: the root conversation, no terminal.
            updateLayoutMode();
            chatRenderedFor = null;
            renderChatStreamTabs(CHAT_ONLY);
            renderActiveAgentChat();
            renderContextUsage();
            renderMonitorConfidence();
            renderActiveProgress();
            renderTabRail();
        }

        "Close a child/extra-root CHAT session; the primary root chat is permanent."
        function closeChatSession(id) {
            if (!id || id === CHAT_SESSION_ID || !chatTabs[id]) return;
            callJulia('flootyCloseChat', JSON.stringify({ session_id: id }))
                .then(function (r) {
                    if (!r || !r.success) return;
                    const closed = Array.isArray(r.closed) ? r.closed : [];
                    for (const cid of closed) {
                        try { removeSessionTab(cid); } catch (e) {
                            try { window.flootyDebug && window.flootyDebug(
                                'removeSessionTab failed ' + cid + ': ' + e); } catch (_e) {}
                        }
                    }
                    try { activateFallbackSession(); } catch (err) {
                        try {
                            window.flootyDebug && window.flootyDebug(
                                'activateFallbackSession failed: ' + err);
                        } catch (_e) {}
                    }
                })
                .catch(function (err) {
                    try {
                        window.flootyDebug && window.flootyDebug(
                            'closeChatSession failed: ' + err);
                    } catch (e) {}
                });
        }
        window.closeChatSession = closeChatSession;

        "Ctrl+Shift+W: close the ACTIVE session (chat, split pane, or tab)."
        function closeActiveSession() {
            if (activeChatId && chatTabs[activeChatId]) {
                // Primary root chat is permanent; closeChatSession is a no-op
                // for it, and must not fall through to a stale terminal id.
                closeChatSession(activeChatId);
                return;
            }
            if (activeBrowserId && browserTabs[activeBrowserId]) {
                // Browser close is not wired yet; never close a stale terminal.
                return;
            }
            if (activeSplitId) {
                const splitTab = Object.keys(terminals).find(function (k) {
                    return terminals[k].juliaId === activeSplitId;
                });
                if (splitTab) { closeTerminal(splitTab); return; }
            }
            if (activeTerminalId && terminals[activeTerminalId]) {
                closeTerminal(activeTerminalId);
            }
        }
        window.closeActiveSession = closeActiveSession;

        function clearTerminal() {
            if (activeTerminalId && terminals[activeTerminalId]) {
                terminals[activeTerminalId].term.clear();
            }
        }

        function killTerminal() {
            if (activeTerminalId) {
                closeTerminal(activeTerminalId);
            }
        }

        // ---- Julia communication (Webviews.jl bound functions) ------------

        // Bound globals are injected by Webviews.bind() as async window methods.
        // If one is missing, surface it instead of throwing a ReferenceError so
        // the reason shows up inside the terminal pane.
        function callJulia(eventName, payload) {
            const fn = window[eventName];
            if (typeof fn !== 'function') {
                return Promise.reject(eventName + ' binding not available');
            }
            // Bindings resolve with the JSON string our Julia handler returned;
            // parse defensively so callers always see an object.
            return fn(payload).then(response => {
                try { return JSON.parse(response); }
                catch (e) { return { success: false, error: String(response) }; }
            });
        }

        function createJuliaTerminal(terminalId) {
            const data = JSON.stringify({
                name: terminals[terminalId].name,
                cmd: terminals[terminalId].sshCmd || defaultShellCommand,
                kind: terminals[terminalId].kind || 'terminal',
                remote: terminals[terminalId].remote || '',
                // The session this create produces belongs to THIS tab: queued
                // prompts are delivered per tab, so another tab's prompt can
                // never start here. A SPLIT CHILD does not focus (it is a second
                // pane in the parent's tab) and must not take the active slot.
                tab: terminalId,
                focus: !terminals[terminalId].splitParent,
                parent_session: terminals[terminalId].parentSession || ''
            });

            callJulia('terminal_create', data).then(result => {
                if (result && result.success) {
                    terminals[terminalId].juliaId = result.terminal_id;
                    // Open the data-plane channel for this session: its PTY
                    // bytes now travel over the binary socket.
                    openChannel(result.terminal_id, terminals[terminalId].term);
                    // Tell Julia this is the split child: the agent can then
                    // address it with {"action":"send","target":"split"}.
                    if (terminals[terminalId].splitParent) {
                        try {
                            const parentTab = terminals[terminalId].splitParent;
                            const parentSid = (terminals[parentTab] || {}).juliaId || '';
                            callJulia('flootySplitCreated', JSON.stringify({
                                terminal_id: result.terminal_id,
                                parent_id: parentSid
                            })).catch(function () {});
                        } catch (e) {}
                    }
                    // The pane was fitted BEFORE this bind existed, so its grid
                    // never reached the PTY: push the real size now (otherwise a
                    // program sees 80x24 while the user sees 31x32).
                    setTimeout(function () {
                        if (typeof fitVisiblePanes === 'function') fitVisiblePanes();
                    }, 0);
                    // Messages that arrived for this id BEFORE the bind (agent
                    // status/thinking pushed while the tab was still unbound)
                    // surface now that the session is identifiable.
                    renderActiveAgentChat();
                    // Bind-time drain: everything buffered for this id while
                    // the binding ran (boot banner + prompt replay) renders
                    // here, BEFORE any subsequently matched live chunk.
                    let drained = -1;
                    try {
                        const queued = pendingOutput[result.terminal_id];
                        drained = 0;
                        if (queued) {
                            delete pendingOutput[result.terminal_id];
                            for (const c of queued) {
                                terminals[terminalId].term.write(c);
                                drained++;
                            }
                        }
                        window.__lastBindDrain =
                            { id: result.terminal_id, drained: drained };
                    } catch (e) {
                        try { window.flootyDebug && window.flootyDebug(
                            'BIND_DRAIN_ERROR ' + e); } catch (_e) {}
                    }
                    // Bind handshake: PULL everything the backend buffered
                    // for this tab (boot banner + prompt). The reply's replay
                    // text is authoritative — it drains the backend buffer
                    // exactly once, so nothing races with live pushes.
                    const boundInfo = terminals[terminalId];
                    if (boundInfo) { boundInfo.handshake = false; boundInfo.preLive = []; }
                    callJulia('terminal_begin_live', JSON.stringify({
                        terminal_id: result.terminal_id })).then(r2 => {
                            const bi = terminals[terminalId];
                            if (!bi) return;
                            if (r2 && r2.replay) bi.term.write(r2.replay);
                            for (const c of (bi.preLive || [])) bi.term.write(c);
                            bi.preLive = [];
                            bi.handshake = true;
                        }).catch(() => {
                            const bi = terminals[terminalId];
                            if (!bi) return;
                            for (const c of (bi.preLive || [])) bi.term.write(c);
                            bi.preLive = [];
                            bi.handshake = true;
                        });
                    try { window.flootyDebug && window.flootyDebug(
                        'terminal_create bound ' + result.terminal_id +
                        ' drained=' + drained); } catch (e) {}
                    // Ownership pill for CREATED tabs: nothing pushed one
                    // while unbound, so default to user-owned and let the
                    // focus report below confirm/correct against the backend.
                    const info0 = terminals[terminalId];
                    if (info0 && !info0.owner) info0.owner = 'julia';
                    renderActiveOwnership();
                    // A SPLIT CHILD is not a tab: reporting it as focused would
                    // move the active ownership to a pane the user did not pick
                    // (the next prompt would run there and its output could land
                    // in no visible terminal).
                    if (!info0 || !info0.splitParent) {
                        callJulia('flootyTabFocused', JSON.stringify({
                            terminal_id: result.terminal_id })).catch(() => {});
                    }
                    updateStatusBar();
                } else {
                    const msg = result && result.error ? result.error : JSON.stringify(result);
                    terminals[terminalId].term.write('\r\n[Error: ' + msg + ']\r\n');
                }
            }).catch(err => {
                terminals[terminalId].term.write('\r\n[Error: ' + err + ']\r\n');
            });
        }

        function killJuliaTerminal(juliaId, tab) {
            const payload = JSON.stringify({
                terminal_id: juliaId,
                force: false,
                tab: tab || ''
            });
            callJulia('terminal_kill', payload);
        }

        // ---- Ownership arbitration (Warp TuiInputTarget-style) ------------
        let ownershipAgent = false;       // true = the AI agent owns the pane
        let lastUserTypingPing = 0;

        function setOwnershipUi(owner, autoFocus) {
            const dbg = m => { try { window.flootyDebug && window.flootyDebug(m); } catch (e) {} };
            const pill = document.getElementById('ownershipPill');
            if (!pill) return;
            ownershipAgent = owner === 'agent';
            pill.style.display = 'inline-flex';
            pill.classList.toggle('owner-agent', ownershipAgent);
            pill.classList.toggle('owner-user', !ownershipAgent);
            // Labels say WHO owns input, in the user's words: "ai" or "user".
            // ("julia" was the REPL-era name for the human side and read as a
            // language name to anyone not steeped in this codebase.)
            document.getElementById('ownershipLabel').textContent =
                ownershipAgent ? 'ai' : 'user';
            dbg('ownership owner=' + owner);
            // On a real TRANSITION to agent ownership the keyboard belongs in
            // the instruction box, never in the REPL the agent is driving.
            // Pure repaints (reason 'focus') must not steal the caret.
            if (autoFocus !== false && ownershipAgent) focusAssistEditor();
        }

        // Ownership pushes are TAGGED with the owning tab's PTY id: store
        // per tab, then paint whichever tab is ACTIVE. Switching tabs
        // repaints from stored state (plus a fresh focus report from the
        // backend), so pills no longer stick across sessions.
        window.handleOwnership = function(sessionId, owner, reason) {
            for (const [, info] of Object.entries(terminals)) {
                if (!sessionId || info.juliaId === sessionId) {
                    info.owner = owner;
                }
            }
            // 'focus' pushes are pure pill repaints on tab switching — never
            // steal the caret for them.
            renderActiveOwnership(reason !== 'focus');
        };
        function renderActiveOwnership(autoFocus) {
            const activeInfo = terminals[activeTerminalId];
            if (activeInfo && activeInfo.owner) {
                setOwnershipUi(activeInfo.owner, autoFocus);
            }
        }

        // ---- Agent chat transcript (per session) ---------------------------
        // The chat carries what the terminal CANNOT: the agent's text (what it
        // says) and its reasoning. Tool calls, commands and command output are
        // deliberately absent — they happen on screen, in the pane below, and
        // repeating them here was pure duplication. Role-tagged messages, per
        // tab, so concurrent sessions never mix.
        const CHAT_MAX_MESSAGES = 200;      // oldest messages are dropped past this
        const CHAT_COALESCE_MS = 2500;      // back-to-back same-role lines join
        const CHAT_ROLE_LABELS = {
            user: 'You', text: 'Agent', thinking: 'Thinking', system: 'System',
            tool: 'Command', warn: 'Warning', error: 'Error', monitor: 'Monitor',
            monitorThinking: 'Monitor'
        };

        // Messages that arrived for a PTY id NO tab binds yet; flushed into the
        // tab's transcript the next time that session is rendered (same
        // contract the old parked-thinking stream had).
        const parkedChat = [];

        // CHAT-ONLY thread: before any terminal exists the rail is a plain
        // conversation with the agent model. It has no PTY, so it is its own
        // info object (same shape the chat renderer expects) and it is MIGRATED
        // into the first terminal tab when one is opened.
        const CHAT_ONLY = {
            name: 'chat', juliaId: null, chat: [], monitorChat: [], trajectoryMonitorChat: [],
            preferencesMonitorChat: [],
            chatStream: 'agent', progress: '', popups: [], exited: false,
            splitParent: null
        };
        // The app's ROOT chat session id (from the ready ping). Chat events are
        // tagged with it; the rail renders them in CHAT_ONLY.
        let CHAT_SESSION_ID = null;
        const chatTabs = Object.create(null);   // chat session id -> info
        const browserTabs = Object.create(null); // browser session id -> info
        let activeChatId = null;
        let activeBrowserId = null;
        let activeFileTreeId = null;
        function activeChatInfo() {
            if (activeBrowserId && browserTabs[activeBrowserId])
                return browserTabs[activeBrowserId];
            if (activeChatId && chatTabs[activeChatId]) return chatTabs[activeChatId];
            return terminals[activeTerminalId] || CHAT_ONLY;
        }
        // With no terminal, CHAT_ONLY *is* the visible chat surface: events for it
        // must repaint the rail (a terminal-tab comparison alone left it stale —
        // the app showed no driver replies). A chat tab is active on its own.
        // Per-session assist drafts. One input box serves every session, so the
        // draft must travel with the session instead of following the user.
        let assistDraftInfo = null;
        function captureAssistDraft() {
            const info = assistDraftInfo || activeChatInfo();
            if (info && assistCm) info.draft = assistCm.getValue();
        }
        function restoreAssistDraft(info) {
            assistDraftInfo = info || null;
            if (!assistCm) return;
            const text = (info && info.draft) || '';
            if (assistCm.getValue() !== text) assistCm.setValue(text);
        }

        function isChatInfoActive(info) {
            return (activeBrowserId && browserTabs[activeBrowserId] === info) ||
                   (activeChatId && chatTabs[activeChatId] === info) ||
                   terminals[activeTerminalId] === info ||
                   (info === CHAT_ONLY && !activeBrowserId && !activeChatId &&
                    !terminals[activeTerminalId]);
        }

        // Which transcript a message belongs to: the agent's or the monitor's.
        function chatArray(info, stream) {
            if (stream === 'terminal')
                return (info.terminalMonitorChat = info.terminalMonitorChat || []);
            if (stream === 'monitor')
                return (info.monitorChat = info.monitorChat || []);
            if (stream === 'trajectory')
                return (info.trajectoryMonitorChat = info.trajectoryMonitorChat || []);
            if (stream === 'preferences')
                return (info.preferencesMonitorChat = info.preferencesMonitorChat || []);
            return (info.chat = info.chat || []);
        }
        function chatStreamOf(info) {
            return (info && info.chatStream) || 'agent';
        }

        function pushChat(info, role, text, stream) {
            const body = text === undefined || text === null ? '' : String(text);
            if (!info || !body.trim()) return;
            stream = stream || 'agent';
            const chat = chatArray(info, stream);
            const now = Date.now();
            const last = chat.length ? chat[chat.length - 1] : null;
            // Monitor reasoning arrives as COMPLETE thoughts, not streamed token
            // fragments. Coalescing several into one bubble let single newlines
            // collapse under Markdown and made the reasoning look crammed.
            const coalesce = role !== 'monitorThinking';
            if (coalesce && last && last.role === role &&
                (now - last.at) < CHAT_COALESCE_MS) {
                // Streamed thinking arrives as token fragments, so append it verbatim. Complete text/assistant thoughts stay on their own lines.
                const join = role === 'thinking' ? '' : '\n';
                last.text += join + body;   // streamed continuation of one message
                last.at = now;
            } else {
                chat.push({ role: role, text: body, at: now });
            }
            if (chat.length > CHAT_MAX_MESSAGES) {
                chat.splice(0, chat.length - CHAT_MAX_MESSAGES);
                if (stream === 'terminal') info.terminalMonitorChatTrimmed = true;
                else if (stream === 'monitor') info.monitorChatTrimmed = true;
                else if (stream === 'trajectory') info.trajectoryMonitorChatTrimmed = true;
                else if (stream === 'preferences') info.preferencesMonitorChatTrimmed = true;
                else info.chatTrimmed = true;
            }
            if (isChatInfoActive(info)) {
                if (stream === 'agent') {
                    info.progress = '';
                    renderActiveProgress();
                }
                if (stream !== chatStreamOf(info)) {

                    renderChatStreamTabs(info);
                } else {
                    renderActiveAgentChat();
                }
            }
        }

        // Stream tabs: which voice the rail is showing for THIS tab.
        function renderChatStreamTabs(info) {
            const strip = document.getElementById('chatStreamTabs');
            if (!strip) return;
            info = info || activeChatInfo();
            const stream = chatStreamOf(info);
            const termBtn = strip.querySelector('[data-stream="terminal"]');
            const hasTerminal = !!(info && info.terminalMonitorChat);
            if (termBtn) termBtn.hidden = !hasTerminal;
            const trajBtn = strip.querySelector('[data-stream="trajectory"]');
            // The trajectory stream is a standing monitor surface. Show its tab
            // even before the first event so SSH/terminal/chat sessions never
            // look like they lack a trajectory watcher.
            const hasTrajectory = !!(info && info.trajectoryMonitorChat !== undefined);
            if (trajBtn) trajBtn.hidden = !hasTrajectory;
            const prefBtn = strip.querySelector('[data-stream="preferences"]');
            const hasPreferences = !!(info && info.preferencesMonitorChat !== undefined);
            if (prefBtn) prefBtn.hidden = !hasPreferences;
            strip.querySelectorAll('.chat-stream-tab').forEach(btn => {
                if (btn.hidden) return;
                btn.classList.toggle('active', btn.dataset.stream === stream);
            });
        }

        // ---- chat tabs (child ChatSessions) --------------------------------
        function activateChatTab(id) {
            const info = chatTabs[id];
            if (!info) return;
            captureAssistDraft();
            activeChatId = id;
            activeBrowserId = null;
            activeTerminalId = null;
            activeSplitId = null;
            const ws = document.querySelector('.workspace');
            ws && ws.classList.remove('browser-focus');
            deactivatePdfPane();
            ws && ws.classList.add('chat-focus');
            document.querySelectorAll('.terminal-tab').forEach(t => t.classList.remove('active'));
            const tab = document.getElementById('chat-tab-' + id);
            if (tab) tab.classList.add('active');
            renderChatStreamTabs(info);
            chatRenderedFor = null;
            renderActiveAgentChat();
            restoreAssistDraft(info);
            updateLayoutMode();
            renderContextUsage();
            renderMonitorConfidence();
            renderActiveProgress();
            renderTabRail();
        }

        // Julia calls this when a child ChatSession is created.
        window.flootyAddChatTab = function (id, name, rootId, parentId) {
            if (!id) return id;
            // The Julia caller knows the ROOT chat id even on the very first
            // turn (the page's ready ping may not have landed yet).
            if (rootId && !CHAT_SESSION_ID) CHAT_SESSION_ID = rootId;
            const rid = rootId || CHAT_SESSION_ID;
            if (rid && id !== rid && !chatTabs[rid]) {
                CHAT_ONLY.name = 'Chat';
                CHAT_ONLY.kind = 'chat';
                chatTabs[rid] = CHAT_ONLY;
                createChatTab(rid, 'Chat');
            }
            if (!chatTabs[id]) {
                chatTabs[id] = { name: name || 'Chat', juliaId: id, chat: [],
                                 monitorChat: [], trajectoryMonitorChat: [], preferencesMonitorChat: [], chatStream: 'agent',
                                 parent: parentId || null,
                                 kind: 'chat', popups: [], exited: false };
                createChatTab(id, name || 'Chat');
            }
            activateChatTab(id);
            return id;
        };

        // ---- browser tabs ---------------------------------------------------
        function unmountTypstPane() {
            if (window.editorLayer && typeof window.editorLayer.unmount === 'function') window.editorLayer.unmount();
            if (window.typstPdfLayer && typeof window.typstPdfLayer.unmount === 'function') window.typstPdfLayer.unmount();
            const typstPanel = document.getElementById('typstPanel');
            if (typstPanel) typstPanel.hidden = true;
        }

        function activateTypstPane(id) {
            const info = browserTabs[id];
            if (!info) return;
            captureAssistDraft();
            activeBrowserId = id;
            activeChatId = null;
            activeTerminalId = null;
            activeSplitId = null;
            const ws = document.querySelector('.workspace');
            ws && ws.classList.remove('chat-focus', 'browser-focus', 'pdf-focus');
            ws && ws.classList.add('typst-focus');
            if (window.pdfLayer && typeof window.pdfLayer.unmount === 'function') window.pdfLayer.unmount();
            deactivatePdfPane();
            ws && ws.classList.add('typst-focus');
            const pdfPanel = document.getElementById('pdfPanel');
            const browserPanel = document.getElementById('browserPanel');
            if (pdfPanel) pdfPanel.hidden = true;
            if (browserPanel) browserPanel.hidden = true;
            const typstPanel = document.getElementById('typstPanel');
            if (typstPanel) typstPanel.hidden = false;
            window.currentEditorSessionId = info.typstEditorId;
            window.currentTypstTabId = id;
            if (window.editorLayer && typeof window.editorLayer.mount === 'function') window.editorLayer.mount(info.typstEditorId);
            if (window.typstPdfLayer && typeof window.typstPdfLayer.mount === 'function') window.typstPdfLayer.mount(info.typstPdfId);
            renderChatStreamTabs(info);
            chatRenderedFor = null;
            renderActiveAgentChat();
            restoreAssistDraft(info);
            updateLayoutMode();
            renderContextUsage();
            renderActiveProgress();
            renderTabRail();
        }

        function deactivateTypstPane() {
            window.currentTypstTabId = null;
            unmountTypstPane();
            const ws = document.querySelector('.workspace');
            if (ws) ws.classList.remove('typst-focus');
        }

        function deactivateFileTreePane() {
            const ws = document.querySelector('.workspace');
            if (ws) ws.classList.remove('filetree-focus');
            const panel = document.getElementById('fileTreePanel');
            if (panel) panel.classList.remove('is-open');
        }

        function activateFileTreeTab(id) {
            const info = browserTabs[id];
            if (!info) return;
            captureAssistDraft();
            deactivatePdfPane();
            deactivateTypstPane();
            const ws = document.querySelector('.workspace');
            ws && ws.classList.remove('chat-focus', 'browser-focus', 'pdf-focus', 'typst-focus', 'filetree-focus');
            activeBrowserId = id;
            activeChatId = null;
            activeTerminalId = null;
            activeSplitId = null;
            activeFileTreeId = id;
            renderChatStreamTabs(info);
            chatRenderedFor = null;
            renderActiveAgentChat();
            restoreAssistDraft(info);
            updateLayoutMode();
            renderContextUsage();
            renderActiveProgress();
            renderTabRail();
        }

        function deactivatePdfPane() {
            deactivateTypstPane();
            if (window.pdfLayer && typeof window.pdfLayer.unmount === 'function') {
                window.pdfLayer.unmount();
            }
            const ws = document.querySelector('.workspace');
            if (ws) ws.classList.remove('pdf-focus');

            const browserPanel = document.getElementById('browserPanel');

            if (browserPanel) browserPanel.hidden = true;
        }

        function activateBrowserTab(id) {
            const info = browserTabs[id];
            if (!info) return;
            captureAssistDraft();
            activeBrowserId = id;
            activeChatId = null;
            activeTerminalId = null;
            activeSplitId = null;
            const ws = document.querySelector('.workspace');

            if (isFileTree) {

            const isTypst = String(info.url || '').includes('typst:');

            deactivateTypstPane();

            ws && ws.classList.remove('browser-focus');
            ws && ws.classList.remove('pdf-focus');
            if (window.pdfLayer && typeof window.pdfLayer.unmount === 'function') window.pdfLayer.unmount();

            const browserPanel = document.getElementById('browserPanel');

        function browserNavigateActive(url) {
            const id = activeBrowserId;
            const info = browserTabs[id];

        function pdfAppWindow() {
            try {
                return window.pdfLayer && typeof window.pdfLayer.api === 'function'
