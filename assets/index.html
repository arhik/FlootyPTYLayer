            } catch (e) { return null; }
        }
        function withPdfApp(fn) {
            const app = pdfAppWindow();
            if (!app) return false;
            try { fn(app); return true; } catch (e) { return false; }
        }
        function copyPdfText(text) {
            text = String(text || '');
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).catch(function () {});
                return true;
            }
            return false;
        }
        function gotoFolioPage(page) {
            return withPdfApp(function (app) { app.gotoPage(Number(page)); });
        }
        function pdfHighlightColor(hex) {
            return withPdfApp(function (app) { app.highlight(String(hex)); });
        }
        function pdfFind(query) {
            return withPdfApp(function (app) { app.search(String(query)); });
        }
        function stepPdfMatch(direction) {
            return withPdfApp(function (app) {
                if (direction === 'previous') app.previousMatch(); else app.nextMatch();
            });
        }
        function pdfRemoveHighlight() {
            return withPdfApp(function (app) { app.removeHighlight('agent'); });
        }
        function pdfReorder(source, target) {
            return withPdfApp(function (app) { app.reorder(Number(source), Number(target)); });
        }
        function pdfSidebarTab(name) {
            const mapping = { pages: 'showPages', outline: 'showOutline', clearMarks: 'clearMarks' };
            return withPdfApp(function (app) {
                const fn = app[mapping[String(name).toLowerCase()]];
                if (typeof fn === 'function') fn();
            });
        }
        function pdfBookmarkCurrent() {
            return withPdfApp(function (app) { app.bookmark(); });
        }
        function pdfTool(action) {
            const mapping = { nextPage: 'nextPage', previousPage: 'previousPage', rotate: 'rotate', zoomIn: 'zoomIn', zoomOut: 'zoomOut', toggleSidebar: 'toggleSidebar', showPages: 'showPages', showOutline: 'showOutline', bookmark: 'bookmark', saveCopy: 'saveCopy', removeHighlight: 'removeHighlight', clearMarks: 'clearMarks' };
            if (action === 'copyPage') {
                const app = pdfAppWindow();
                if (!app || typeof app.getPageText !== 'function') return false;
                Promise.resolve(app.getPageText()).then(copyPdfText).catch(function () {});
                return true;
            }
            return withPdfApp(function (app) {
                const fn = app[mapping[action]];
                if (typeof fn === 'function') fn();
            });
        }
        function pdfNote(text) {
            return withPdfApp(function (app) { app.note(String(text)); });
        }
        function pdfCopyCurrentPage() {
            const app = pdfAppWindow();
            if (!app || typeof app.getPageText !== 'function') return false;
            Promise.resolve(app.getPageText()).then(copyPdfText).catch(function () {});
            return true;
        }
        function pdfCopySelection() {
            const app = pdfAppWindow();
            if (!app || typeof app.getSelectionText !== 'function') return false;
            return copyPdfText(app.getSelectionText());
        }
        function pdfActionForUrl(url) {
            const u = String(url || '');
            let match = u.match(/^pdf:page:(\d+)$/);
            if (match) return function () { gotoFolioPage(Number(match[1])); };
            match = u.match(/^pdf:highlight:(#?[0-9A-Fa-f]{6})$/);
            if (match) {
                const color = match[1].startsWith('#') ? match[1] : '#' + match[1];
                return function () { pdfHighlightColor(color); };
            }
            match = u.match(/^pdf:search:(.+)$/);
            if (match) return function () { pdfFind(decodeURIComponent(match[1])); };
            match = u.match(/^pdf:(next|previous)-match:$/);
            if (match) return function () { stepPdfMatch(match[1]); };
            if (u === 'pdf:copySelection:') return function () { pdfCopySelection(); };
            match = u.match(/^pdf:control:(nextPage|previousPage|zoomIn|zoomOut|rotate|copyPage|toggleSidebar|showPages|showOutline|bookmark|saveCopy|removeHighlight|clearMarks)$/);
            if (match) return function () { pdfTool(match[1]); };
            match = u.match(/^pdf:note:(.+)$/);
            if (match) return function () { pdfNote(decodeURIComponent(match[1])); };
            match = u.match(/^pdf:reorder:(\d+):(\d+)$/);
            if (match) return function () { pdfReorder(Number(match[1]), Number(match[2])); };
            return null;
        }
        function handlePdfNavigation(info, url, active) {
            if (handlePdfToolRequest(info, url, active)) return true;
            const action = pdfActionForUrl(url);
            if (!action) return false;
            info.url = info.url || '/viewer/index.html';
            if (active) {
                action();
                const input = document.getElementById('browserUrl');
                if (input) input.value = '';
            }
            return true;
        }

        function handlePdfToolRequest(info, url, active) {
            const match = String(url || '').match(/^pdf:tool:([^:]+):(.*)$/);
            if (!match) return false;
            const requestId = match[1];
            let payload;
            try { payload = JSON.parse(decodeURIComponent(match[2])); } catch (e) { payload = null; }
            const respond = function (result, ok) {
                callJulia('flootyPdfToolResult', JSON.stringify({
                    session_id: info.juliaId || activeBrowserId || '', request: requestId,
                    tool: payload && payload.tool || 'unknown',
                    result: String(result || ''), ok: !!ok
                })).catch(function () {});
            };
            const app = pdfAppWindow();
            if (!app || !payload) { respond('no pdf session', false); return true; }
            const action = payload.tool;
            const args = payload.args || {};
            const promise = (async function () {
                switch (action) {
                    case 'goto':
                        await app.gotoPage(Number(args.page) || 1, 'agent');
                        return String(app.currentPage());
                    case 'nextPage':
                    case 'previousPage':
                    case 'zoomIn':
                    case 'zoomOut':
                    case 'rotate':
                    case 'toggleSidebar':
                    case 'showPages':
                    case 'showOutline':
                        await Promise.resolve(app[action]('agent'));
                        return String(app.currentPage());
                    case 'clearMarks':
                        await Promise.resolve(app.clearMarks('agent'));
                        return 'cleared';
                    case 'search': {
                        const matches = await Promise.resolve(app.search(String(args.query || ''), 'agent'));
                        return String(matches ? matches.length : 0);
                    }
                    case 'nextMatch':
                    case 'previousMatch': {
                        const fn = action === 'nextMatch' ? app.nextMatch : app.previousMatch;
                        await Promise.resolve(fn.call(app));
                        return 'done';
                    }
                    case 'copySelection': return String(app.getSelectionText() || '');
                    case 'copyPage': return String(await app.getPageText());
                    case 'note': await Promise.resolve(app.note(args.text, 'agent')); return 'note';
                    case 'highlight': await Promise.resolve(app.highlight(args.color, '', 'agent')); return 'highlight';
                    case 'removeHighlight': await Promise.resolve(app.removeHighlight('agent')); return 'removeHighlight';
                    case 'bookmark': await Promise.resolve(app.bookmark()); return 'bookmark';
                    case 'saveCopy': await Promise.resolve(app.saveCopy('agent')); return 'saved';
                    case 'clearSearch': await Promise.resolve(app.clearSearch()); return 'cleared';
                    case 'reorder': await Promise.resolve(app.reorder(Number(args.source) || 1, Number(args.target) || 1, 'agent')); return 'reordered';
                    default: throw new Error('unknown tool');
                }
            })();
            promise.then(function (result) { respond(result, true); },
                          function (error) { respond(String(error && error.message || error), false); });
            const input = document.getElementById('browserUrl');
            if (input) input.value = '';
            return true;
        }

        window.flootyAddBrowserTab = function (id, name, url, rootId, parentId) {
            if (!id) return id;
            if (rootId && !CHAT_SESSION_ID) CHAT_SESSION_ID = rootId;
            const rid = rootId || CHAT_SESSION_ID;
            if (rid && id !== rid && !chatTabs[rid]) {
                CHAT_ONLY.name = 'Chat';
                CHAT_ONLY.kind = 'chat';
                chatTabs[rid] = CHAT_ONLY;
                createChatTab(rid, 'Chat');
            }
            if (!browserTabs[id]) {
                browserTabs[id] = {
                    name: name || 'browser', juliaId: id,
                    url: url || 'about:blank', chat: [], monitorChat: [], trajectoryMonitorChat: [], preferencesMonitorChat: [],
                    chatStream: 'agent', parent: parentId || null,
                    kind: 'browser', popups: [], exited: false
                };
            }
            activateBrowserTab(id);
            return id;
        };

        window.flootyAddTypstTab = function (id, name, projectRoot, editorId, pdfId, rootId, parentId) {
            if (!id) return id;
            if (rootId && !CHAT_SESSION_ID) CHAT_SESSION_ID = rootId;
            const rid = rootId || CHAT_SESSION_ID;
            if (rid && id !== rid && !chatTabs[rid]) {
                CHAT_ONLY.name = 'Chat';
                CHAT_ONLY.kind = 'chat';
                chatTabs[rid] = CHAT_ONLY;
                createChatTab(rid, 'Chat');
            }
            if (!browserTabs[id]) {
                browserTabs[id] = {
                    name: name || 'Typst', juliaId: id,
                    url: 'typst:' + id,
                    projectRoot: projectRoot || '', typstEditorId: editorId, typstPdfId: pdfId,
                    chat: [], monitorChat: [], trajectoryMonitorChat: [], preferencesMonitorChat: [],
                    chatStream: 'agent', parent: parentId || null,
                    kind: 'typst', popups: [], exited: false
                };
            } else {
                browserTabs[id].url = 'typst:' + id;
                browserTabs[id].projectRoot = projectRoot || browserTabs[id].projectRoot || '';
                browserTabs[id].typstEditorId = editorId || browserTabs[id].typstEditorId;
                browserTabs[id].typstPdfId = pdfId || browserTabs[id].typstPdfId;
                browserTabs[id].kind = 'typst';
            }
            activateBrowserTab(id);
            return id;
        };

        window.flootyAddFileTreeTab = function (id, name, rootId, parentId) {
            if (!id) return id;
            if (rootId && !CHAT_SESSION_ID) CHAT_SESSION_ID = rootId;
            const rid = rootId || CHAT_SESSION_ID;
            if (rid && id !== rid && !chatTabs[rid]) {
                CHAT_ONLY.name = 'Chat';
                CHAT_ONLY.kind = 'chat';
                chatTabs[rid] = CHAT_ONLY;
                createChatTab(rid, 'Chat');
            }
            if (!browserTabs[id]) {
                browserTabs[id] = {
                    name: name || 'File tree', juliaId: id,
                    url: 'filetree:' + id,
                    kind: 'filetree', chat: [], monitorChat: [], trajectoryMonitorChat: [], preferencesMonitorChat: [],
                    chatStream: 'agent', parent: parentId || null,
                    popups: [], exited: false
                };
            } else {
                browserTabs[id].kind = 'filetree';
                browserTabs[id].url = 'filetree:' + id;
            }
            activateBrowserTab(id);
            return id;
        };

        function selectChatStream(stream) {
            const info = activeChatInfo();
            if (info) {
                info.chatStream = stream;
            }
            // First look at a session's Chat monitor: ask the app to announce
            // it (the one-shot pause trace may not have happened yet).
            if (stream === 'monitor') reportChatInteraction('attach');
            renderChatStreamTabs(info);
            chatRenderedFor = null;          // rebuild for the other stream
            renderActiveAgentChat();
        }

        document.querySelectorAll('#chatStreamTabs .chat-stream-tab').forEach(btn => {
            btn.addEventListener('click', () => selectChatStream(btn.dataset.stream));
        });

        // WHICH TAB an event belongs to. A session id matches the tab bound to that
        // PTY. An EMPTY id is NOT a broadcast: it means the producer fired before
        // the bind (chat-only boot) or the session was never registered, so the
        // event belongs to the tab the user is looking at. Fanning an empty id out
        // to every tab mixed the transcripts of multiple tabs.
        function targetsForSession(sessionId) {
            const out = [];
            if (sessionId && browserTabs[sessionId]) {
                out.push(browserTabs[sessionId]);
                return out;
            }
            if (sessionId && chatTabs[sessionId]) {
                out.push(chatTabs[sessionId]);
                return out;
            }
            if (sessionId && CHAT_SESSION_ID && sessionId === CHAT_SESSION_ID) {
                out.push(chatTabs[CHAT_SESSION_ID] || CHAT_ONLY);
                return out;
            }
            if (sessionId) {
                for (const [, info] of Object.entries(terminals)) {
                    if (info.juliaId === sessionId) out.push(info);
                }
            } else {
                const active = terminals[activeTerminalId];
                out.push(active || CHAT_ONLY);
            }
            return out;
        }

        // Tag a message with the session's PTY id: every tab bound to that id
        // (user view + agent view of ONE PTY) gets it.
        function pushChatForSession(sessionId, role, text, stream) {
            const targets = targetsForSession(sessionId);
            for (const info of targets) pushChat(info, role, text, stream);
            if (!targets.length && text && (!stream || stream === 'trajectory')) {
                parkedChat.push({ sid: sessionId || '', tab: activeTerminalId || '',
                                  role: role, text: String(text),
                                  stream: stream || 'agent', at: Date.now() });
            }
        }

        // ---- tool blocks in the transcript ----------------------------------
        // The agent loop tags a call and its result with the same id; the page keeps
        // ONE folded block per call (the command line visible, the output behind the
        // fold) and fills it in place when the result arrives.
        function pushToolBlockForSession(sessionId, ev) {
            const targets = targetsForSession(sessionId);
            for (const info of targets) {
                info.toolBusy = true;
                const chat = (info.chat = info.chat || []);
                chat.push({ role: 'tool', id: ev.id || '', tool: ev.tool || 'tool',
                            text: ev.text || '', ok: null, result: '',
                            at: Date.now() });
                if (chat.length > CHAT_MAX_MESSAGES) {
                    chat.splice(0, chat.length - CHAT_MAX_MESSAGES);
                    info.chatTrimmed = true;
                }
            }
            if (!targets.length) {
                parkedChat.push({ sid: sessionId || '', tab: activeTerminalId || '',
                                  role: 'tool', id: ev.id || '', tool: ev.tool || 'tool',
                                  text: ev.text || '', ok: null, result: '',
                                  at: Date.now() });
            }
            if (targets.includes(terminals[activeTerminalId])) {
                renderActiveAgentChat();
            }
            renderTabRail();
        }

        function finishToolBlockForSession(sessionId, ev) {
            let index = -1;
            let filled = null;
            for (const info of targetsForSession(sessionId)) {
                info.toolBusy = false;
                const chat = info.chat || [];
                for (let i = chat.length - 1; i >= 0; i--) {
                    if (chat[i].role !== 'tool') continue;
                    if (ev.id && chat[i].id !== ev.id) continue;
                    if (chat[i].ok !== null && chat[i].ok !== undefined) continue;
                    chat[i].result = ev.text || '';
                    chat[i].ok = !!ev.ok;
                    if (isChatInfoActive(info)) { index = i; filled = chat[i]; }
                    break;
                }
            }
            if (filled === null) {                 // the call is still parked
                for (let i = parkedChat.length - 1; i >= 0; i--) {
                    const p = parkedChat[i];
                    if (p.role === 'tool' &&
                        (p.sid ? p.sid === sessionId : p.tab === activeTerminalId) &&
                        (p.ok === null || p.ok === undefined)) {
                        p.result = ev.text || '';
                        p.ok = !!ev.ok;
                        break;
                    }
                }
                return;
            }
            // Patch the block that is already on screen instead of rebuilding the
            // transcript, so a block the user opened stays open.
            const el = document.getElementById('agentChatLog');
            const node = el ? el.querySelectorAll('.chat-msg')[index] : null;
            if (node) updateToolNode(node, filled);
        }

        function flushParkedChat(info) {
            if (!info || !info.juliaId || !parkedChat.length) return;
            // Collect-and-remove BEFORE pushing: pushChat repaints the active
            // tab, which re-enters this flush — leaving the entries in the
            // queue would re-flush the same message forever (stack overflow).
            const mine = [];
            for (let i = parkedChat.length - 1; i >= 0; i--) {
                const p = parkedChat[i];
                // A parked event belongs to the tab it was parked FOR: by session
                // id when it had one, by tab otherwise. Never to "whoever renders
                // next" — that is how one tab's messages appeared in another.
                if (p.sid ? p.sid === info.juliaId : p.tab === info.id) {
                    mine.unshift(p);
                    parkedChat.splice(i, 1);
                }
            }
            for (const p of mine) {
                if (p.role === 'tool') {
                    const chat = (info.chat = info.chat || []);
                    chat.push(p);
                } else {
                    pushChat(info, p.role, p.text, p.stream || 'agent');
                }
            }
        }

        // Markdown for agent text. micromark + GFM are the bundles FlootyApp vendors;
        // they load as ES modules (async), so until then text renders escaped, and the
        // transcript is rebuilt once the module arrives.
        let markdownGen = 0;
        function escapeHtml(s) {
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }
        function renderMarkdown(text) {
            const src = (text === undefined || text === null) ? '' : String(text);
            const ext = window.micromarkGfm || {};
            if (window.micromark && typeof ext.gfm === 'function') {
                try {
                    // Same call shape as FlootyApp: the bundles export FACTORIES.
                    // allowDangerousHtml stays off, so agent text can never inject markup.
                    return window.micromark(src, {
                        extensions: [ext.gfm()],
                        htmlExtensions: [ext.gfmHtml()],
                        allowDangerousHtml: false
                    });
                } catch (e) { /* fall through to escaped text */ }
            }
            return escapeHtml(src).replace(/\n/g, '<br>');
        }

        // ---- tool call + result as one foldable block ----------------------
        function toolMessageNode(msg) {
            const row = document.createElement('div');
            row.className = 'chat-msg role-tool';
            const details = document.createElement('details');
            details.className = 'chat-tool';
            details.open = false;                      // folded until asked
            const summary = document.createElement('summary');
            const name = document.createElement('span');
            name.className = 'tool-name';
            name.textContent = msg.tool || 'tool';
            const detail = document.createElement('span');
            detail.className = 'tool-detail';
            detail.textContent = msg.text || '';
            const state = document.createElement('span');
            state.className = 'tool-state ' + toolStateClass(msg);
            state.textContent = toolStateText(msg);
            summary.appendChild(name);
            summary.appendChild(detail);
            summary.appendChild(state);
            const body = document.createElement('div');
            body.className = 'tool-body';
            const pre = document.createElement('pre');
            pre.textContent = msg.result || '';
            body.appendChild(pre);
            details.appendChild(summary);
            details.appendChild(body);
            row.appendChild(details);
            return row;
        }
        function toolStateClass(msg) {
            if (msg.ok === undefined || msg.ok === null) return 'running';
            return msg.ok ? 'ok' : 'err';
        }
        function toolStateText(msg) {
            if (msg.ok === undefined || msg.ok === null) return 'running';
            return msg.ok ? 'ok' : 'err';
        }
        // Patch a block in place (its result arrived): no rebuild, so a block the
        // user opened stays open.
        function updateToolNode(node, msg) {
            if (!node) return;
            const state = node.querySelector('.tool-state');
            if (state) {
                state.className = 'tool-state ' + toolStateClass(msg);
                state.textContent = toolStateText(msg);
            }
            const pre = node.querySelector('.tool-body pre');
            if (pre && msg.result !== undefined && msg.result !== null) pre.textContent = msg.result;
        }

        function chatClock(at) {
            const d = new Date(at);
            const pad = n => (n < 10 ? '0' + n : '' + n);
            return pad(d.getHours()) + ':' + pad(d.getMinutes());
        }

        function chatMessageNode(msg) {
            if (msg.role === 'tool') return toolMessageNode(msg);
            const row = document.createElement('div');
            row.className = 'chat-msg role-' + msg.role;
            const who = document.createElement('div');
            who.className = 'chat-who';
            who.textContent = (CHAT_ROLE_LABELS[msg.role] || 'Agent') + ' · ' +
                              chatClock(msg.at);
            const bubble = document.createElement('div');
            bubble.className = 'chat-bubble';
            if (msg.role === 'text' || msg.role === 'thinking' ||
                msg.role === 'monitorThinking') {
                // Agent prose AND its reasoning are markdown (micromark escapes raw
                // HTML by default, so neither can inject markup). Reasoning keeps its
                // dim amber chrome — only the formatting is shared.
                bubble.classList.add('md');
                bubble.innerHTML = renderMarkdown(msg.text);
            } else {
                bubble.textContent = msg.text;
            }
            row.appendChild(who);
            row.appendChild(bubble);
            return row;
        }

        // DIAGNOSTIC SURFACE for the transcript state the UI is actually showing,
        // per tab. Page state (`terminals`, `activeTerminalId`) is script-scoped and
        // NOT reliably visible to `evaluateJavaScript` from the app, so probes and
        // debuggers read it through THIS function instead of poking internals.
        window.flootyChatState = function () {
            const out = { active: activeTerminalId, tabs: {} };
            for (const k in terminals) {
                out.tabs[k] = {
                    juliaId: terminals[k].juliaId || null,
                    stream: chatStreamOf(terminals[k]),
                    unread: terminals[k].monitorUnread || 0,
                    chat: (terminals[k].chat || []).map(m => ({ role: m.role,
                                                                text: m.text })),
                    monitor: (terminals[k].monitorChat || []).map(m => ({ role: m.role,
                                                                          text: m.text }))
                };
            }
            return out;
        };

        // Incremental transcript renderer: appends only what is new, repaints
        // the newest bubble in place (it can still be growing), rebuilds after
        // a tab switch or a cap trim, and follows the tail ONLY when the user
        // was already at the bottom (normal chat behavior).
        let chatRenderedFor = null;
        let chatRendering = false;
        let chatRenderScheduled = false;
        let chatRenderTimer = 0;
        const CHAT_RENDER_MS = 50;
        const MD_RENDER_MS = 150;
        // Coalesce renders to at most one DOM rebuild per 50ms. The agent
        // streams thinking tokens one at a time; rendering the full transcript
        // per token blocked the key handler and the xterm itself.
        function renderActiveAgentChat() {
            if (chatRenderTimer) return;
            chatRenderTimer = window.setTimeout(function () {
                chatRenderTimer = 0;
                const el = document.getElementById('agentChatLog');
                if (!el || chatRendering) return;
                chatRendering = true;
                try {
                    renderActiveAgentChatIn(el);
                } finally {
                    chatRendering = false;
                }
            }, CHAT_RENDER_MS);
        }

        function renderActiveAgentChatIn(el) {
            const info = activeChatInfo();
            flushParkedChat(info);
            const stream = chatStreamOf(info);
            const chat = info ? chatArray(info, stream) : [];
            // Key by the ACTIVE SURFACE, not the last PTY: a chat/browser tab
            // leaves activeTerminalId unchanged, so terminal->chat->terminal
            // produced the same key and appended the two transcripts.
            const key = (activeBrowserId ? 'browser:' + activeBrowserId
                       : activeChatId ? 'chat:' + activeChatId
                       : 'term:' + (activeTerminalId || 'chat-only')) + ':' + stream;
            const trimmed = info &&
                (stream === 'terminal' ? info.terminalMonitorChatTrimmed :
                 stream === 'monitor' ? info.monitorChatTrimmed : info.chatTrimmed);
            const atBottom = (el.scrollHeight - el.scrollTop - el.clientHeight) < 40;
            if (chatRenderedFor !== key || trimmed) {
                el.textContent = '';   // tab/stream switch, or the cap dropped history
                chatRenderedFor = key;
                if (info) {
                    if (stream === 'terminal') info.terminalMonitorChatTrimmed = false;
                    else if (stream === 'monitor') info.monitorChatTrimmed = false;
                    else info.chatTrimmed = false;
                }
            }
            const shown = el.querySelectorAll('.chat-msg').length;
            const placeholder = el.querySelector('.chat-empty');
            if (!chat.length) {
                if (!placeholder) {
                    const ph = document.createElement('div');
                    ph.className = 'chat-empty';
                    ph.textContent = info === CHAT_ONLY
                        ? 'Chat only — press \u2303\u21e7T to open a terminal and attach its agent.'
                        : (stream === 'terminal'
                            ? 'No terminal monitor messages yet.'
                            : stream === 'monitor'
                                ? 'No chat monitor messages yet.'
                                : 'No agent messages yet.');
                    el.appendChild(ph);
                }
                return;
            }
            if (placeholder) placeholder.remove();
            for (let i = shown; i < chat.length; i++) {
                el.appendChild(chatMessageNode(chat[i]));
            }
            const lastNode = el.lastElementChild;
            const lastMsg = chat[chat.length - 1];
            if (lastMsg && lastMsg.role === 'tool') {
                updateToolNode(lastNode, lastMsg);
            } else {
                const lastBubble = lastNode ? lastNode.querySelector('.chat-bubble') : null;
                if (lastBubble) {
                    const streamingMd = lastMsg &&
                        (lastMsg.role === 'text' ||
                         lastMsg.role === 'thinking' ||
                         lastMsg.role === 'monitorThinking');
                    // While a streaming bubble is growing, re-render micromark only
                    // every 150ms; render the raw text immediately between passes so
                    // the pane tracks the model live without paying markdown parses
                    // per token.
                    if (streamingMd) {
                        const now = Date.now();
                        const bubble = lastBubble;
                        if (bubble.__mdAt && now - bubble.__mdAt < MD_RENDER_MS) {
                            bubble.textContent = lastMsg.text;
                        } else {
                            bubble.innerHTML = renderMarkdown(lastMsg.text);
                            bubble.__mdAt = now;
                        }
                    } else {
                        lastBubble.textContent = lastMsg ? lastMsg.text : '';
                    }
                }
            }
            if (atBottom) {
                try { el.scrollTop = el.scrollHeight; } catch (e) {}
            }
        }

        // Live agent events, PER SESSION, KIND-TAGGED.
        //   text       -> chat message            (what the agent says)
        //   thinking   -> chat reasoning bubble   (dim italic)
        //   toolcall   -> a folded tool block     (the command is on screen)
        //   toolresult -> that block's outcome
        //   progress   -> the live phase line above the assist bar
        //   status     -> warn/error land in the chat; info is NOT surfaced (the
        //                 status strip carries no agent activity by design)
        const AGENT_EVENT_HANDLERS = {
            text: (sessionId, ev) => pushChatForSession(sessionId, 'text', ev.text),
            thinking: (sessionId, ev) => pushChatForSession(sessionId, 'thinking', ev.text),
            toolcall: (sessionId, ev) => pushToolBlockForSession(sessionId, ev),
            toolresult: (sessionId, ev) => finishToolBlockForSession(sessionId, ev),
            progress: (sessionId, ev) => setAgentProgress(sessionId, ev.text),
            browserNavigate: (sessionId, ev) => {
                const info = browserTabs[sessionId];
                if (!info) return;
                const url = String(ev.url || '');
                if (handlePdfNavigation(info, url, sessionId === activeBrowserId)) return;
                info.url = url;
                if (activeBrowserId === sessionId) {
                    const frame = document.getElementById('browserFrame');
                    if (frame) frame.src = info.url;
                    const input = document.getElementById('browserUrl');
                    if (input) input.value = info.url;
                }
            },
            insight: (sessionId, ev) => {
                const m = (ev && ev.monitor) || 'chat';
                const stream = m === 'terminal' ? 'terminal'
                              : m === 'trajectory' ? 'trajectory'
                              : m === 'preferences' ? 'preferences' : 'monitor';
                return pushChatForSession(sessionId, 'monitor', ev.text, stream);
            },
            monitorThinking: (sessionId, ev) => {
                const text = String((ev && ev.text) || '');
                const m = (ev && ev.monitor) || 'chat';
                const stream = m === 'terminal' ? 'terminal'

                'background:transparent; color:#eaeaea; border:none; outline:none; ' +
                'font:13px "Menlo",Consolas,monospace; line-height:1.45; ' +

            // with the agent model; a terminal (and its monitoring agent) comes
            // from Ctrl+Shift+T, which also takes this thread over.

            pushChat(info, 'user', text);
            reportChatInteraction('submit');
  callJulia('flootyAssistSubmit', JSON.stringify({
      text: text, tab: activeTerminalId,
      // The focused pane's SESSION: the instruction goes to that session's
      // agent, not to whichever session is globally active.
      terminal_session_id: focusedSessionId(),
      session_id: activeBrowserId || activeChatId ||

  }))
    .then(r => { if (!(r && r.success)) { try { window.flootyDebug && window.flootyDebug(
                        'assistSubmit FAILED: ' + JSON.stringify(r)); } catch (e) {} } })
    .catch(err => { try { window.flootyDebug && window.flootyDebug(
                    'assistSubmit threw: ' + err); } catch (e) {} });

            // empty draft (it would burn the monitor cooldown without text).

            if (chatTypingTimer) { clearTimeout(chatTypingTimer); chatTypingTimer = null; }

        let chatTypingTimer = null;
        function reportChatInteraction(kind) {
            // The CHAT interface of the ACTIVE session: the root chat session when
            // no terminal exists, otherwise that terminal's chat rail.
            const info = activeBrowserId ? browserTabs[activeBrowserId]
                       : activeChatId ? chatTabs[activeChatId]
                                      : terminals[activeTerminalId];

            // CHAT_SESSION_ID. Falling through here made every root-chat pause
            // return early, so the Chat monitor never ran.
            const sid = (info && (info.juliaId || info.sessionId || info.id))
                        || CHAT_SESSION_ID;

            const text = assistCm ? String(assistCm.getValue() || '').slice(-300) : '';
            if (kind !== 'attach' && kind !== 'submit' && text.trim().length < 3) return;

                session_id: sid, kind: kind, text: text,

        // ---- Live selection -> Julia ---------------------------------------

        // event collapses the selection and leaves the pasteboard untouched. Julia

        // whenever it changes: the document's selection first, else the active
        // terminal's (xterm keeps its own).
        function liveSelectionText() {
            const info = activeBrowserId ? browserTabs[activeBrowserId] : null;
            if (info && String(info.url || '').includes('/viewer/')) {
                const app = pdfAppWindow();
                const pdfText = app && typeof app.getSelectionText === 'function'
                    ? String(app.getSelectionText() || '') : '';

                Object.values(terminals).filter(i => i !== active))

        // selection — transcript or terminal — through the web process, then put
        // the user's highlight back so a second ⌘C copies the same text again.

            const text = liveSelectionText();
            if (!text) return false;
            const sel = window.getSelection();
            const saved = [];
            for (let i = 0; i < sel.rangeCount; i++) saved.push(sel.getRangeAt(i).cloneRange());
            const focused = document.activeElement;
            const textarea = (focused && focused.tagName === 'TEXTAREA') ? focused : null;
            const taStart = textarea ? textarea.selectionStart : 0;
            const taEnd = textarea ? textarea.selectionEnd : 0;

            holder.setAttribute('readonly', '');
            holder.style.position = 'fixed';
            holder.style.top = '-1000px';
            holder.style.opacity = '0';
            document.body.appendChild(holder);

            try { ok = document.execCommand('copy'); } catch (e) { ok = false; }

                    focused.focus();

                } catch (e) {}

                'copySelection ' + (ok ? 'ok' : 'FAILED') + ' chars=' + text.length); } catch (e) {}
            return ok;
        };

        // Called by the app's ⌘V handler (installEditingKeyHandler!): insert the
        // clipboard text wherever the caret is — the assist editor, or the active

        // WebKit's own paste does nothing in this process, the same way its copy does.
        window.flootyPaste = function (text) {

            let where = 'none';

                // CodeMirror when it loaded, the plain-textarea fallback otherwise —
                // both surfaces have to accept a paste.

                    ok = true;
                } else if (typeof active.setRangeText === 'function') {

                    ok = true;

                if (info && info.term && typeof info.term.paste === 'function') {

                    ok = true;
                    where = 'terminal';

                // The assist box is the single input surface. A paste with focus
                // in the transcript/chat pane (or body) must land there, not
                // silently fail because no terminal is active.
                if (typeof assistCm.replaceSelection === 'function') {

                ' chars=' + text.length); } catch (e) {}

        };

        let selectionPing = null;

        // ---- Agent model picker -------------------------------------------
        // The list comes from Julia (the agent package owns the endpoint), so the

        let agentModels = { current: '', monitor: '', decision: '',

        // A raw /v1/models id (no provider prefix) and its grouped provider
        // id refer to the same model. Compare the ids after removing the
        // routing prefix so the picker can select the grouped form.
        function stripModelProviderPrefix(name) {
            return String(name || '').replace(/^(llamacpp|chutes|ollama|ssh|sshhub):/, '');
        }
        function sameModelName(a, b) {
            if (!a || !b) return false;
            return a === b || stripModelProviderPrefix(a) === stripModelProviderPrefix(b);
        }

        function fillModelSelect(el, current, available, emptyLabel, providers,
                                 allowFirst = true) {
            if (!el) return;
            while (el.firstChild) el.removeChild(el.firstChild);
            if (!available.length && !(providers && providers.length) && !current) {
                const opt = document.createElement('option');
                opt.textContent = emptyLabel;
                el.appendChild(opt);
                el.classList.add('empty');
                el.disabled = true;
                return;
            }
            el.classList.remove('empty');
            el.disabled = false;
            let selectedCurrent = false;
            // When providers are known, group models under <optgroup> labels;
            // otherwise flat <option> rendering preserves backward compatibility.
            if (providers && providers.length) {
                for (const grp of providers) {
                    const label = grp.name || '';
                    const models = grp.models || [];
                    const og = document.createElement('optgroup');
                    og.label = label;
                    for (const name of models) {
                        const opt = document.createElement('option');
                        opt.value = name;
                        opt.textContent = name;
                        if (sameModelName(name, current)) {
                            opt.selected = true;
                            selectedCurrent = true;
                        }
                        og.appendChild(opt);
                    }
                    el.appendChild(og);
                }
            } else {
                for (const name of available) {
                    const opt = document.createElement('option');
                    opt.value = name;
                    opt.textContent = name;
                    if (sameModelName(name, current)) {
                        opt.selected = true;
                        selectedCurrent = true;
                    }
                    el.appendChild(opt);
                }
            }
            // If neither list carries the active id, keep it visible rather
            // than silently displaying (and later switching to) the first
            // option. This happens in the brief window before provider groups
            // replace the flat /v1/models fallback.
            if (!selectedCurrent && current) {
                const opt = document.createElement('option');
                opt.value = current;
                opt.textContent = current;
                opt.selected = true;
                el.appendChild(opt);
                selectedCurrent = true;
            }
            // A control with no explicit current value (e.g. Monitor/Decision
            // before one is chosen) must show an empty choice, never inherit the
            // driver's model. The driver keeps its first-option fallback for the
            // brief window before the current id is known.
            if (!selectedCurrent && !allowFirst) {
                const opt = document.createElement('option');
                opt.value = '';
                opt.textContent = emptyLabel;
                opt.selected = true;
                el.appendChild(opt);
                selectedCurrent = true;
            }
            if (!selectedCurrent && allowFirst && available.length) el.value = available[0];
        }

        function renderModelSelect() {
            fillModelSelect(modelSelect, agentModels.current,
                            agentModels.available, 'no models',
                            agentModels.providers);

                            agentModels.available, 'no monitor model',
                            agentModels.providers, false);
            fillModelSelect(decisionSelect, agentModels.decision,
                            agentModels.decision_models, 'no decision model',
                            null, false);
        }

        let modelFetchRetries = 0;
        let modelMenuOpen = false;
        async function refreshAgentModels() {
            const gen = agentModelGen;
            const active = terminals[activeTerminalId];
            const tid = active ? (active.juliaId || '') : '';
            try {
                const state = await callJulia('flootyModels',
                                              JSON.stringify({ terminal_id: tid }));
                const still = terminals[activeTerminalId];
                const stillId = still ? (still.juliaId || '') : '';
                if (gen !== agentModelGen || stillId !== tid) return;
                if (state && state.success) {
                    agentModels = { current: state.current || '',
                                    monitor: state.monitor || '',
                                    decision: state.decision || '',
                                    available: state.available || [],
                                    decision_models: state.decision_models || [],
                                    speech_models: state.speech_models || [],
                                    providers: state.providers || [] };
                    const tabNow = terminals[activeTerminalId];
                    if (tabNow) tabNow.model = agentModels.current;   // per-tab memory
                    // Never rebuild an open native <select> popup: the click
                    // that opened it fires mousedown, and replacing its options
                    // mid-menu can swallow the choice. The change/blur handlers
                    // repaint from the fresh state instead.
                    if (!modelMenuOpen) renderModelSelect();
                    // The backend refreshes the endpoint's list in the BACKGROUND
                    // (a binding must never block on HTTP), so the first answer
                    // can be empty: ask again shortly instead of showing a dead
                    // "no models" control.
                    if (!agentModels.available.length && modelFetchRetries < 6) {
                        modelFetchRetries++;
                        setTimeout(refreshAgentModels, 700);
                    } else if (agentModels.available.length) {
                        modelFetchRetries = 0;
                    }
                }
            } catch (e) { /* no agent package in this process: leave it empty */ }
        }

        if (modelSelect) {
            modelSelect.addEventListener('mousedown', () => { modelMenuOpen = true; });
            modelSelect.addEventListener('blur', () => {
                modelMenuOpen = false;
                renderModelSelect();
            });
            modelSelect.addEventListener('change', async () => {
                modelMenuOpen = false;
                const want = modelSelect.value;
                agentModelGen++;                     // our choice wins over in-flight reads
                let state = null;
                try {
                    const activeNow = terminals[activeTerminalId];
                    state = await callJulia('flootySetModel',
                                            JSON.stringify({ model: want,
                                                terminal_id: activeNow ? (activeNow.juliaId || '') : '' }));
                } catch (e) { state = null; }
                // Invalidate any read that began while the set was in flight:
                // its answer predates this choice and would otherwise paint the
                // old model back into the picker.
                agentModelGen++;
                agentModels = (state && state.success) ?
                    { current: state.current || want,
                      monitor: state.monitor || agentModels.monitor,
                      decision: state.decision || agentModels.decision,
                      available: state.available || [],
                      decision_models: state.decision_models || agentModels.decision_models,
                      speech_models: state.speech_models || agentModels.speech_models,
                      providers: state.providers || agentModels.providers } :
                    { current: want, monitor: agentModels.monitor,
                      decision: agentModels.decision,
                      available: agentModels.available,
                      decision_models: agentModels.decision_models,
                      speech_models: agentModels.speech_models,
                      providers: agentModels.providers };
                const tabNow = terminals[activeTerminalId];
                if (tabNow) tabNow.model = agentModels.current;
                renderModelSelect();
                try { window.flootyDebug && window.flootyDebug(
                    'modelSelect -> ' + agentModels.current); } catch (e) {}
            });
            if (monitorSelect) {
                monitorSelect.addEventListener('change', async () => {
                    const want = monitorSelect.value;
                    const activeNow = terminals[activeTerminalId];
                    let state = null;
                    try {
                        state = await callJulia('flootySetMonitorModel',
                                                JSON.stringify({ model: want,
                            terminal_id: activeNow ? (activeNow.juliaId || '') : '' }));
                    } catch (e) { state = null; }
                    if (state && state.success) {
                        agentModels = { current: state.current || agentModels.current,
                                        monitor: state.monitor || want,
                                        decision: state.decision || agentModels.decision,
                                        available: state.available || agentModels.available,
                                        decision_models: state.decision_models || agentModels.decision_models,
                                        speech_models: state.speech_models || agentModels.speech_models,
                                        providers: state.providers || agentModels.providers };
                    } else {
                        agentModels.monitor = want;
                    }
                    renderModelSelect();
                    try { window.flootyDebug && window.flootyDebug(
                        'monitorSelect -> ' + agentModels.monitor); } catch (e) {}
                });
                monitorSelect.addEventListener('mousedown', () => {
                    modelMenuOpen = true;
                    refreshAgentModels();
                });
                monitorSelect.addEventListener('blur', () => {
                    modelMenuOpen = false;
                    renderModelSelect();
                });
            }
            if (decisionSelect) {
                decisionSelect.addEventListener('change', async () => {
                    modelMenuOpen = false;
                    const want = decisionSelect.value;
                    agentModelGen++;
                    const activeNow = terminals[activeTerminalId];
                    let state = null;
                    try {
                        state = await callJulia('flootySetDecisionModel',
                                                JSON.stringify({ model: want,
                            terminal_id: activeNow ? (activeNow.juliaId || '') : '' }));
                    } catch (e) { state = null; }
                    agentModelGen++;
                    if (state && state.success) {
                        agentModels = { current: state.current || agentModels.current,
                                        monitor: state.monitor || agentModels.monitor,
                                        decision: state.decision !== undefined ? state.decision : want,
                                        available: state.available || agentModels.available,
                                        decision_models: state.decision_models || agentModels.decision_models,
                                        speech_models: state.speech_models || agentModels.speech_models,
                                        providers: state.providers || agentModels.providers };
                    } else {
                        agentModels.decision = want;
                    }
                    renderModelSelect();
                    try { window.flootyDebug && window.flootyDebug(
                        'decisionSelect -> ' + agentModels.decision); } catch (e) {}
                });
                decisionSelect.addEventListener('mousedown', () => {
                    modelMenuOpen = true;
                    refreshAgentModels();
                });
                decisionSelect.addEventListener('blur', () => {
                    modelMenuOpen = false;
                    renderModelSelect();
                });
            }
            // No polling: refresh when the user reaches for the control.
            modelSelect.addEventListener('mousedown', refreshAgentModels);
            renderModelSelect();        // "no models" until Julia answers
            refreshAgentModels();
        }

        // ---- Push model: Julia calls these on the window ------------------

        // Chunks that arrived for a juliaId NO tab binds yet (the gap between
        // spawning a terminal and terminal_create's promise resolving). Kept
        // in arrival order and drained at bind time so boot output — banner
        // plus the prompt replay pushed DURING the binding — never vanishes.
        const pendingOutput = {};

        window.handleTerminalOutput = function(juliaId, output) {
            // One PTY can back MULTIPLE tabs (user view + agent view of the
            // SAME session) — fan the chunk out to every one of them.
            let hit = 0;
            for (const [terminalId, info] of Object.entries(terminals)) {
                if (info.juliaId === juliaId) {
                    if (info.handshake === false) {
                        // Bind handshake in flight: hold so nothing renders
                        // AHEAD of the authoritative backend-buffered replay.
                        (info.preLive = info.preLive || []).push(output);
                        scheduleTerminalBufferPush(info);
                    } else {
                        info.term.write(output);
                        scheduleTerminalBufferPush(info);
                    }
                    hit++;
                }
            }
            if (hit === 0 && output.length > 0) {
                (pendingOutput[juliaId] = pendingOutput[juliaId] || []).push(output);
                try { window.flootyDebug && window.flootyDebug('outputPush BUFFERED ' +
                    juliaId + ' len=' + output.length); } catch (e) {}
            }
        };

        function showExitActions(terminalId, info) {
            const panel = document.getElementById(terminalId);
            if (!panel) return;
            const old = panel.querySelector(".exit-actions");
            if (old) old.remove();
            const bar = document.createElement("div");
            bar.className = "exit-actions";
            bar.style.cssText = "position:absolute;left:12px;bottom:12px;" +
                "display:flex;gap:8px;z-index:20;";
            const mk = (label, fn) => {
                const b = document.createElement("button");
                b.textContent = label;
                b.style.cssText = "padding:4px 10px;border-radius:4px;" +
                    "border:1px solid rgba(255,255,255,0.25);" +
                    "background:rgba(30,30,30,0.9);color:#ddd;" +
                    "font:12px Menlo,monospace;cursor:pointer;";
                b.onclick = fn;
                return b;
            };
            bar.appendChild(mk("Revive", function () {
                bar.remove();
                const cmd = info.sshCmd || defaultShellCommand;
                callJulia("terminal_reconnect", JSON.stringify({
                    terminal_id: info.juliaId, cmd: cmd
                })).then(function (r) {
                    if (r && r.success) {
                        info.exited = false;
                        info.term.write("\r\n\x1b[2m[revived]\x1b[0m\r\n");
                    }
                }).catch(function () {});
            }));
            bar.appendChild(mk("Close", function () {
                bar.remove();
                closeTerminal(terminalId);
            }));
            panel.appendChild(bar);
        }

        window.handleTerminalExit = function(juliaId, exitCode) {
            for (const [terminalId, info] of Object.entries(terminals)) {
                if (info.juliaId === juliaId) {
                    info.exited = true;
                    info.term.write('\r\n\x1b[2m[Terminal exited with code ' + exitCode + ']\x1b[0m\r\n');
                    pushChat(info, 'system',
                             'Terminal exited with code ' + exitCode + '.');
                    if (info.kind === 'ssh') {
                        const last = (info.remote || sshTargetHistory()[0] || '');
                        flootyPrompt('Reconnect ssh (user@host)', 'user@host', last,
                                     sshTargetHistory()).then(function (target) {
                            if (!target) return;
                            rememberSshTarget(target);
                            info.remote = target;
                            info.sshCmd = 'ssh ' + target;
                            callJulia('terminal_reconnect', JSON.stringify({
                                terminal_id: info.juliaId,
                                cmd: 'ssh ' + target
                            })).then(function (r) {
                                if (r && r.success) {
                                    info.exited = false;
                                    info.term.write('\r\n\x1b[2m[reconnecting to ' +
                                        target + ']\x1b[0m\r\n');
                                }
                            }).catch(function () {});
                        });
                    }
                    showExitActions(terminalId, info);
                    break;
                }
            }
        };

        // ---- Agent feedback popups (Julia pushes via dispatch+eval!) ------
        // PER SESSION like ownership/status: each popup is TAGGED with its
        // session's PTY id. It renders ONLY while that session's tab is
        // active; on background tabs it parks in the tab's popup store,
        // badges that tab's unread count, and shows when you switch to it
        // (Warp ambient-agent behavior, made per-session). "" broadcasts.
        const POPUP_TTL_MS = 6000;      // visible lifetime once shown
        window.handleAgentFeedback = function(sessionId, title, body, kind) {
            try { window.flootyDebug && window.flootyDebug(
                'agentPopup sid=' + sessionId + ' title=' + title +
                ' kind=' + kind); } catch (e) {}
            let hit = false;
            for (const [, info] of Object.entries(terminals)) {
                if (!sessionId || info.juliaId === sessionId) {
                    info.popups.push({ title: title || '', body: body || '',
                                       kind: kind || 'info', at: Date.now() });
                    hit = true;
                }
            }
            if (!hit) {   // no tab bound yet — PARK it so an adopt arriving
                          // within the TTL still surfaces the message.
                parkedPopups.push({ sid: sessionId || '', title: title || '',
                                    body: body || '', kind: kind || 'info',
                                    at: Date.now() });
            }
            renderActivePopups();     // repaints active tab's stack + badges
            try { window.flootyAgentPopupShown &&
                window.flootyAgentPopupShown(JSON.stringify({
                    sessionId: sessionId || '', title: title || '',
                    kind: kind || 'info', displayed:
                        displayedForSession(sessionId)
                })); } catch (e) {}
        };
        // Popups that arrived before any tab bound their juliaId. Pruned by
        // age whenever anything touches them.
        const parkedPopups = [];
        const POPUP_PARK_MS = POPUP_TTL_MS;

        function displayedForSession(sessionId) {
            const activeInfo = terminals[activeTerminalId];
            return !sessionId || !!(activeInfo &&
                (activeInfo.juliaId === sessionId));
        }

        // Render the ACTIVE tab's stored popups (badge reset included).
        function renderActivePopups() {
            const stack = document.getElementById('agentPopups');
            if (!stack) return;
            stack.innerHTML = '';
            pruneParkedPopups();
            const activeInfo = terminals[activeTerminalId];
            if (!activeInfo) return;
            const live = [];
            for (const p of activeInfo.popups) {
                if (Date.now() - p.at > POPUP_TTL_MS) continue;   // expired while hidden
                live.push(p);
                stack.appendChild(buildPopupCard(p.title, p.body, p.kind));
            }
            activeInfo.popups = live;
            // Parked broadcast/early popups for THIS session surface here too
            // (e.g. the popup probe pushes before the first tab exists).
            for (const p of parkedPopups) {
                if (!p.sid || p.sid === activeInfo.juliaId) {
                    stack.appendChild(buildPopupCard(p.title, p.body, p.kind));
                    p.shown = true;
                    try { window.flootyAgentPopupShown &&
                        window.flootyAgentPopupShown(JSON.stringify({
                            sessionId: p.sid || '', title: p.title,
                            kind: p.kind, displayed: true
                        })); } catch (e) {}
                }
            }
            pruneParkedPopups();
            updateAllPopupBadges();   // draining this tab clears its badge
        }

        function pruneParkedPopups() {
            const nowMs = Date.now();
            for (let i = parkedPopups.length - 1; i >= 0; i--) {
                if (parkedPopups[i].shown || nowMs - parkedPopups[i].at > POPUP_PARK_MS) {
                    parkedPopups.splice(i, 1);
                }
            }
        }

        function buildPopupCard(title, body, kind) {
            const card = document.createElement('div');
            card.className = 'agent-popup kind-' + (kind || 'info');
            const bodyEl = document.createElement('div');
            bodyEl.className = 'agent-popup-body';
            const titleEl = document.createElement('div');
            titleEl.className = 'agent-popup-title';
            titleEl.textContent = title || 'Agent';
            const textEl = document.createElement('div');
            textEl.className = 'agent-popup-text';
            textEl.textContent = body || '';
            bodyEl.appendChild(titleEl);
            bodyEl.appendChild(textEl);
            const dismiss = document.createElement('button');
            dismiss.className = 'agent-popup-dismiss';
            dismiss.textContent = '\u00d7';
            dismiss.onclick = () => removePopup(card, 'dismiss');
            card.appendChild(bodyEl);
            card.appendChild(dismiss);
            requestAnimationFrame(() => requestAnimationFrame(() =>
                card.classList.add('shown')));
            setTimeout(() => removePopup(card, 'ttl'), POPUP_TTL_MS);
            return card;
        }

        // Unread count per TAB: stored popups not yet rendered because their
        // session's tab is in the background.
        function updateAllPopupBadges() {
            pruneParkedPopups();
            const nowMs = Date.now();
            for (const [terminalId, info] of Object.entries(terminals)) {
                const unread = info.juliaId ? info.popups.filter(
                    p => nowMs - p.at <= POPUP_TTL_MS).length : 0;
                const el = document.getElementById('popup-badge-' + terminalId);
                if (!el) continue;
                el.textContent = String(unread);
                el.style.display = unread > 0 ? 'inline-flex' : 'none';
            }
        }

        function removePopup(card, reason) {
            if (!card || card.dataset.removing) return;
            card.dataset.removing = '1';
            try { window.flootyDebug && window.flootyDebug(
                'agentPopupRemoved reason=' + (reason || 'dismiss') +
                ' title=' + (card.querySelector('.agent-popup-title') || {}).textContent); } catch (e) {}
            card.classList.remove('shown');
            card.classList.add('leaving');
            setTimeout(() => card.remove(), 320);
        }

        function formatContextTokens(n) {
            n = Number(n) || 0;
            if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + 'M';
            if (n >= 1e3) return (n / 1e3).toFixed(1) + 'k';
            return String(n);
        }

        // Per-active-session context meter. Hidden until an agent turn reports
        // usage; the bar uses the same ratio the loop compacts at (85%).
        function renderContextUsage() {
            const el = document.getElementById('contextUsage');
            if (!el) return;
            const info = activeChatInfo();
            const tokens = info && info.contextTokens;
            const limit = (info && info.contextLimit) || 0;
            if (tokens === undefined || tokens === null || tokens === 0) {
                el.hidden = true;
                return;
            }
            el.hidden = false;
            const ratio = limit > 0 ? Math.min(1, tokens / limit) : 0;
            const pct = limit > 0 ? Math.round(ratio * 100) : 0;
            const fill = document.getElementById('contextUsageFill');
            if (fill) {
                fill.style.width = (ratio * 100).toFixed(1) + '%';
                fill.className = ratio >= 0.85 ? 'hot' : ratio >= 0.6 ? 'warn' : '';
            }
            const text = document.getElementById('contextUsageText');
            if (text) {
                text.textContent = limit > 0
                    ? 'ctx ' + formatContextTokens(tokens) + ' / ' +
                      formatContextTokens(limit) + ' (' + pct + '%)'
                    : 'ctx ' + formatContextTokens(tokens);
            }
            el.title = limit > 0
                ? 'Context: ' + tokens + ' / ' + limit + ' estimated tokens (' +
                  pct + '%). Auto-compacts at 85%.'
                : 'Context: ' + tokens + ' estimated tokens.';
        }

        function renderMonitorConfidence() {
            const box = document.getElementById('monitorConfidence');
            if (!box) return;
            const info = activeChatInfo();
            const value = info && info.monitorConfidence;
            if (value === undefined || value === null) {
                box.hidden = true;
                return;
            }
            const source = String(info.monitorConfidenceSource || 'monitor');
            const labels = { terminal: 'Terminal', chat: 'User',
                             trajectory: 'Trajectory', prompt: 'PS2',
                             preferences: 'Preferences' };
            const colors = { terminal: 'rgba(140,190,255,0.95)',
                             chat: 'rgba(127,209,160,0.95)',
                             trajectory: 'rgba(177,140,255,0.95)',
                             prompt: 'rgba(229,184,75,0.95)',
                             preferences: 'rgba(229,229,16,0.9)' };
            box.hidden = false;
            const ring = document.getElementById('confidenceRing');
            if (ring) {
                ring.style.setProperty('--conf', value.toFixed(1));
                ring.style.setProperty('--conf-color',
                    colors[source] || 'rgba(140,190,255,0.9)');
            }
            const label = document.getElementById('confidenceLabel');
            if (label) label.textContent = (labels[source] || source) + ' ' +
                                           Math.round(value) + '%';
            box.title = (labels[source] || source) +
                        ' monitor confidence: ' + Math.round(value) + '%';
        }

        function updateStatusBar() {
            const n = Object.keys(terminals).length;
            document.getElementById('status-terminals').textContent =
                n + (n === 1 ? ' terminal' : ' terminals');
            document.getElementById('status-shell').textContent = defaultShellCommand.split(' ')[0];
            if (activeTerminalId && terminals[activeTerminalId]) {
                const { rows, cols } = terminals[activeTerminalId].term;
                document.getElementById('status-dimensions').textContent = rows + '×' + cols;
            }
            renderContextUsage();
            renderMonitorConfidence();
        }

        // Window controls forward to the FLOOTY-PREFIXED bound functions. The
        // prefix matters: Webviews.bind() installs its shim at document start,
        // but this page's own function declarations parse LATER and overwrite
        // any same-named window property — a plain "closeWindow" binding would
        // be clobbered by the declaration below (and only sometimes restored by
        // bind's stray eval!, which raced page load). That silent no-op was the
        // flaky autoclose in runUiProbe. With prefixed names there is nothing
        // to collide and callJulia always sees the current shim.
        function closeWindow() {
            callJulia('flootyCloseWindow', '{}').catch(err => console.error(err));
        }
        function minimizeWindow() {
            callJulia('flootyMinimizeWindow', '{}').catch(() => { /* optional */ });
        }

        // Native focus plumbing (flootyWebUi.jl) re-activates the app and makes
        // the WKWebView first responder once the run loop is live; the web view
        // becoming key does not automatically focus the xterm <textarea>, so
        // restore it here. Clicking anywhere in a pane re-focuses its terminal.
        function focusActiveTerminal() {
            if (activeTerminalId && terminals[activeTerminalId] &&
                !terminals[activeTerminalId].exited) {
                terminals[activeTerminalId].term.focus();
            }
        }

        // PRIMARY caret target: the assist editor. The REPL pane gets focus
        // only from an explicit click (mousedown handler above) — window
        // refocuses, tab switches, and post-submit/post-run moments all land
        // here so the next instruction can be typed immediately.
        function focusAssistEditor() {
            // Never yank the caret out of a terminal the user is TYPING in.
            // The ownership flips back and forth while the agent works (the
            // user types, the agent yields; the agent resumes, the user types
            // again), and stealing the caret on every flip sent the user's
            // keystrokes to the instruction box — the cursor went back and
            // forth between the two.
            const active = document.activeElement;
            if (active && active.classList &&
                active.classList.contains('xterm-helper-textarea')) {
                return;
            }
            // Never yank the caret (and thereby the selection) out of a transcript
            // or terminal selection the user just made.
            const sel = window.getSelection();
            if (sel && !sel.isCollapsed && sel.toString()) return;
            for (const [, info] of Object.entries(terminals)) {
                const term = info && info.term;
                if (!term || typeof term.getSelection !== 'function') continue;
                let has = '';
                try { has = term.getSelection(); } catch (e) { has = ''; }
                if (has) return;
            }
            try { assistCm && assistCm.focus(); } catch (e) {}
        }

        // window.addEventListener('focus', focusAssistEditor); // allow direct terminal input to retain focus
        document.addEventListener('mousedown', () => { /* term handles clicks */ });

        // Handle window resize
        // Every VISIBLE pane must follow a layout change: the active tab AND the
        // split child (which is not the active tab, and used to keep its old
        // 80x24 grid while the window changed around it).
        function fitVisiblePanes() {
            const ids = [];
            if (activeTerminalId) ids.push(activeTerminalId);
            for (const cid of activeSplitPool()) {
                if (cid && cid !== activeTerminalId) ids.push(cid);
            }
            for (const id of ids) {
                const info = terminals[id];
                if (!info) continue;
                const el = document.getElementById(id);
                // Skip panes that are not laid out (hidden tab, collapsed split).
                if (!el || !el.offsetParent) continue;
                try { info.fitAddon.fit(); } catch (e) { continue; }
                if (info.juliaId) {
                    try { sendTerminalResize(info); } catch (e) {}
                }
            }
            updateStatusBar();
        }
        window.addEventListener('resize', fitVisiblePanes);
        // has — fixes the "must drag-resize the window before it shows right".
        try {
            const _fitObserver = new ResizeObserver(() => { fitVisiblePanes(); });
            const _tc = document.getElementById('terminal-container');
            if (_tc) _fitObserver.observe(_tc);
        } catch (e) {}
        function forceFitActive() {
            fitVisiblePanes();
        }
        // Split / close-split: ONE button that reflects the current state.
        (function installSessionButton() {
            const btn = document.getElementById('sessionBtn');
            if (btn) btn.addEventListener('click', () => openSessionChooser('sibling'));
        })();

        (function installSplitButton() {
            const btn = document.getElementById('splitBtn');
            if (!btn) return;
            const refresh = () => {
                const has = activeSplitPool().length > 0;
                btn.textContent = has ? 'close split' : 'split';
                btn.style.borderColor = has ?
                    'rgba(177,140,255,0.8)' : 'rgba(255,255,255,0.18)';
            };
            btn.addEventListener('click', () => {
                activeSplitPool().length ? closeChildTerminal() : splitTerminal();
                refresh();
            });
            setInterval(refresh, 500);
            refresh();
        })();

        (function installWorkspacePanel() {
            const panel = document.getElementById('workspacePanel');
            const rail = document.getElementById('workspaceRailToggle');
            const closeBtn = document.getElementById('workspaceClose');
            const list = document.getElementById('workspaceList');
            const pathInput = document.getElementById('workspaceAddPath');
            const addBtn = document.getElementById('workspaceAddBtn');
            const search = document.getElementById('workspaceSearch');
            const dropZone = document.getElementById('workspaceDropZone');
            const folderCount = document.getElementById('workspaceFolderCount');
            const fileCount = document.getElementById('workspaceFileCount');
            const errorEl = document.getElementById('workspaceError');
            const errorMessage = document.getElementById('workspaceErrorMessage');
            const errorClose = document.getElementById('workspaceErrorClose');
            const attentionBadge = document.getElementById('workspaceAttentionBadge');
            if (!panel || !list) return;
            let selectedWorkspacePath = '';
            let workspaceFolders = [];
            let searchQuery = '';
            const currentTerminalId = () => {
                if (activeBrowserId && browserTabs[activeBrowserId]) {
                    const info = browserTabs[activeBrowserId];
                    return String(info.juliaId || info.sessionId || activeBrowserId);
                }

        "Render the dedicated file-tree session pane from the workspace API."
