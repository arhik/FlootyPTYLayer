<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Flooty Terminal</title>
    <!-- Bridge note: terminal_create/input/resize/kill plus the flooty-prefixed
         flootyCloseWindow/flootyMinimizeWindow are global async functions injected
         by Webviews.jl's bind() (RPC shim). Each takes ONE JSON string argument
         and resolves to a JSON string. The flooty prefix is REQUIRED: a bound
         name identical to one of this page's own function declarations gets
         overwritten when the page script parses (see closeWindow below). -->
    <!-- xterm.js + addons, pinned to the set upstream published together
         (xterm 5.5.0 / addon-fit 0.10.0 / addon-webgl 0.18.0, 2024-04-05).
         addon-webgl swaps xterm's DOM renderer for a WebGL2 canvas renderer:
         the grid is painted on the GPU instead of one DOM element per cell.
         If the addon fails to load, the page keeps working on the DOM
         renderer (see enableGpuRenderer). -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css" />
    <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-webgl@0.18.0/lib/addon-webgl.js"></script>
    <!-- Assist editor: LOCAL CodeMirror 5 bundles (same proven copies
         FlootyOldPTY/libs uses — no CDN dependency for the input surface). -->
    <link rel="stylesheet" href="libs/codemirror.min.css" />
    <link rel="stylesheet" href="libs/dracula.min.css" />
    <script src="libs/codemirror.min.js"></script>
    <!-- markdown mode needs xml as its dependency -->
    <script src="libs/xml.min.js"></script>
    <script src="libs/markdown.min.js"></script>
    <script src="libs/julia.min.js"></script>
    <!-- The data plane: one binary WebSocket per terminal carries the PTY
         bytes (raw, no JSON). runtime.js tells the page the channel's port. -->
    <script src="runtime.js"></script>
    <script src="js/terminal-core.js"></script>
    <style>
        /* Terminal palette. The chat rail is the SAME surface as the pane — same
           background, same accents — so the two read as one terminal instead of a
           web panel bolted beside it. Values mirror xtermTheme() in this file.
           color-scheme:dark is what makes WebKit paint DARK overlay scrollbars and
           native controls (::-webkit-scrollbar only styles classic scrollbars). */
        :root {
            color-scheme: dark;
            --term-bg: #1e1e1e;
            --term-fg: #d4d4d4;
            --term-blue: #2472c8;
            --term-bright-blue: #3b8eea;
            --term-magenta: #bc3fbc;
            --term-bright-magenta: #d670d6;
            --term-yellow: #e5e510;
            --term-bright-yellow: #f5f543;
            --term-bright-green: #23d18b;
            --term-bright-red: #f14c4c;
        }

        /* FlootyOldPTY glassmorphic theme ---------------------------------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            /* Glass knobs (see #appBackground). The photo sits on <body>;
               #appBackground veils it with a scrim and blurs it — the classic
               glassmorphic recipe: heavy blur, dark soft veil, barely-there wall. */
            --backdrop-blur: 12px;
            --backdrop-gain: 1;
            --backdrop-scrim: 0.55;
            --backdrop-sat: 1.1;
            --wall-opacity: 1;
            --ui-opacity: 1;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: url('background.jpg') center/cover no-repeat;
            opacity: var(--wall-opacity, 1);
            z-index: -1;
            pointer-events: none;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #14151a;
            color: #e8e8e8;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Glass veil over the photo: a single full-screen layer carrying the
           scrim AND the blur (backdrop-filter), so WebKit paints one backdrop.
           Blur is what makes it read as glass rather than a dimmed photo —
           keep the scrim dark enough that the wall is a hint, not a scene. */
        #appBackground {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(rgba(0, 0, 0, var(--backdrop-scrim, 0.55)),
                                        rgba(0, 0, 0, var(--backdrop-scrim, 0.55)));
            backdrop-filter: blur(var(--backdrop-blur, 12px))
                             brightness(var(--backdrop-gain, 1))
                             saturate(var(--backdrop-sat, 1.1));
            -webkit-backdrop-filter: blur(var(--backdrop-blur, 12px))
                                     brightness(var(--backdrop-gain, 1))
                                     saturate(var(--backdrop-sat, 1.1));
            z-index: -1;
            pointer-events: none;
        }

        /* Film-grain noise overlay (SVG turbulence filter). Lives INSIDE
           #appBackground so the grain rides the wallpaper only — never the UI. */
        #grain {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            filter: url(#noise);
            opacity: 0.05;
            pointer-events: none;
        }

        /* Agent feedback popups --------------------------------------------- */
        #agentPopups {
            position: fixed;
            right: 18px;
            top: 18px;
            z-index: 90000;
            display: flex;
            flex-direction: column-reverse;   /* newest notification on top */
            gap: 10px;
            width: 340px;
            pointer-events: none;
        }
        .agent-popup {
            pointer-events: auto;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 10px 12px;
            background: rgba(20, 21, 26, calc(0.92 * var(--ui-opacity, 1)));
            border: 1px solid rgba(255, 255, 255, 0.14);
            color: rgba(255, 255, 255, 0.92);
            font-size: 12px;
            line-height: 1.45;
            transform: translateX(calc(100% + 30px));
            opacity: 0;
            transition: transform 0.28s ease, opacity 0.28s ease;
        }
        .agent-popup.shown {
            transform: translateX(0);
            opacity: 1;
        }
        .agent-popup.leaving {
            transform: translateX(calc(100% + 30px));
            opacity: 0;
        }
        .agent-popup::before {
            content: '';
            flex: 0 0 2px;
            align-self: stretch;
            background: var(--accent, #4fc3f7);
            margin-right: 2px;
        }
        .agent-popup.kind-info { --accent: #4fc3f7; }
        .agent-popup.kind-warn { --accent: #ffb74d; }
        .agent-popup.kind-interrupt { --accent: #ef5350; }
        .agent-popup-body { flex: 1; min-width: 0; }
        .agent-popup-title {
            font-weight: 600;
            font-size: 12px;
            margin-bottom: 3px;
            color: var(--accent, #4fc3f7);
        }
        .agent-popup-text {
            color: rgba(255, 255, 255, 0.85);
            word-wrap: break-word;
            white-space: pre-wrap;
        }
        .agent-popup-dismiss {
            flex: 0 0 auto;
            width: 18px;
            height: 18px;
            margin-left: 4px;
            border: none;
            cursor: pointer;
            background: transparent;
            color: rgba(255, 255, 255, 0.55);
            font-size: 12px;
            line-height: 1;
            padding: 0;
        }
        .agent-popup-dismiss:hover { color: #fff; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.3); }
        * { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.2) transparent; }

        /* Title bar — flat, separated by a hairline only */
        .titlebar {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 52px;
            padding: 0 20px;
            -webkit-app-region: drag;
            user-select: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .titlebar h1 {
            margin: 0;
            font-size: 1.2em;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.9);
        }
        .titlebar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        #settingsToggle {
            -webkit-app-region: no-drag;
            cursor: pointer;
            padding: 6px;
            border-radius: 6px;
            transition: background 0.2s;
            margin-right: 8px;
        }
        #settingsToggle:hover { background: rgba(255, 255, 255, 0.1); }
        #settingsToggle svg { width: 18px; height: 18px; fill: none; stroke: rgba(255,255,255,0.8); }

        /* Window controls: plain glyph buttons, no boxes */
        .window-controls {
            -webkit-app-region: no-drag;
            display: flex;
            gap: 14px;
        }
        .window-btn {
            border: none;
            cursor: pointer;
            padding: 2px 4px;
            background: transparent;
            color: rgba(255, 255, 255, 0.6);
            font-size: 15px;
            line-height: 1;
        }
        .window-btn:hover {
            color: #fff;
        }
        .btn-close:hover { color: #ef5350; }
        .btn-minimize:hover { color: #ffb74d; }

        /* Toolbar — flat action row under a hairline; buttons are plain text */
        .toolbar {
            position: relative;
            z-index: 10;
            display: flex;
            gap: 18px;
            align-items: center;
            padding: 8px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .toolbar button,
        .toolbar button.secondary {
            padding: 0;
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.65);
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
        }
        .toolbar button:hover {
            color: #fff;
        }
        .toolbar-hint {
            color: rgba(255, 255, 255, 0.45);
            font-size: 11px;
        }

        /* Workspace: VERTICAL tab rail on the left + terminal area. Rail is
           separated from the pane by one hairline; tabs are plain rows whose
           active state is brightness + a 2px left accent (a separator, not
           a bounding box). */
        .workspace {
            position: relative;
            z-index: 10;
            flex: 1;
            display: flex;
            min-height: 0;
        }
        .workspace-main {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }
        .workspace-body {
            flex: 1;
            min-height: 0;
            display: flex;
        }
        /* Horizontal child session strips, one per level of the active path. */
        /* No top horizontal child tabs: the arena itself shows the parent and
           its siblings. The same strips are available as a TREE MAP overlay on
           Ctrl+Shift+O / the rail button. */
        .child-tabs {
            display: none;
            position: absolute;
            z-index: 60;
            top: 10px;
            left: 56px;
            min-width: 240px;
            max-width: 520px;
            max-height: 60vh;
            flex-direction: column;
            gap: 4px;
            padding: 8px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 8px;
            background: rgba(18, 19, 24, calc(0.96 * var(--ui-opacity, 1)));
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
            overflow: auto;
        }
        .child-tabs.tree-map-open { display: flex; }
        .child-tabs:empty { display: none; }
        .root-icon.tree-map-btn { color: rgba(255, 255, 255, 0.45); font-size: 14px; }
        .settings-btn { margin-top: auto; font-size: 15px; color: rgba(255, 255, 255, 0.45); }

        /* Settings panel --------------------------------------------------- */
        .settings-panel {
            position: fixed;
            inset: 0;
            z-index: 95000;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.45);
        }
        .settings-panel[hidden] { display: none; }
        .settings-card {
            width: 380px;
            max-width: calc(100vw - 40px);
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            background: rgba(28, 28, 34, calc(0.92 * var(--ui-opacity, 1)));
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 12px;
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
        }
        .settings-panel-title {
            font-size: 11px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.45);
        }
        .settings-row { display: flex; flex-direction: column; gap: 6px; }
        .settings-row label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.8);
        }
        .settings-value { color: rgba(255, 255, 255, 0.55); font-family: Menlo, Consolas, monospace; }
        .settings-row input[type="range"] { width: 100%; accent-color: #b18cff; }
        .settings-actions { display: flex; gap: 8px; margin-top: 4px; }
        .settings-actions button {
            flex: 1;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 5px;
            color: rgba(255, 255, 255, 0.85);
            font: inherit;
            font-size: 12px;
            padding: 8px 10px;
            cursor: pointer;
        }
        .settings-actions button:hover {
            border-color: rgba(177, 140, 255, 0.7);
            color: #fff;
        }
        .child-strip {
            display: flex;
            align-items: center;
            gap: 4px;
            overflow-x: auto;
        }
        .child-tab {
            flex: none;
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 3px 8px;
            border: 1px solid transparent;
            border-radius: 4px;
            color: rgba(255, 255, 255, 0.55);
            font: 11px Menlo, Consolas, monospace;
            cursor: pointer;
            white-space: nowrap;
        }
        .child-tab:hover { color: rgba(255, 255, 255, 0.9); }
        .child-tab.active {
            color: #fff;
            background: rgba(177, 140, 255, 0.12);
            border-color: rgba(177, 140, 255, 0.55);
        }
        .child-tab .dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--term-bright-yellow, #e5e510);
        }
        .child-tab .close-btn {
            opacity: 0.4; font-size: 12px; margin-left: 2px;
        }
        .child-tab .close-btn:hover { opacity: 1; color: #ef5350; }
        .root-icon .close-btn {
            position: absolute;
            top: -3px; right: -3px;
            width: 14px; height: 14px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%;
            background: rgba(20, 21, 26, 0.9);
            color: rgba(255, 255, 255, 0.7);
            font-size: 11px; line-height: 1;
            opacity: 0;
            cursor: pointer;
        }
        .root-icon:hover .close-btn { opacity: 1; }
        .root-icon .close-btn:hover { color: #ef5350; }
        /* Compact root icon rail. */
        .root-icon {
            position: relative;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid transparent;
            border-radius: 7px;
            color: rgba(255, 255, 255, 0.5);
            font: 12px Menlo, Consolas, monospace;
            cursor: pointer;
        }
        .root-icon:hover { color: rgba(255, 255, 255, 0.9); }
        .root-icon.active {
            color: #fff;
            background: rgba(177, 140, 255, 0.14);
            border-color: rgba(177, 140, 255, 0.6);
        }
        .root-icon .dot {
            position: absolute;
            right: 3px;
            top: 3px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--term-bright-yellow, #e5e510);
        }
        .terminal-tabs {
            flex: none;
            /* Fit the square icon + its horizontal padding instead of a fixed
               text-rail width. */
            width: max-content;
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 6px 4px;
            overflow-y: auto;
            overflow-x: hidden;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }
        .terminal-tab {
            padding: 8px 14px;
            background: transparent;
            border: none;
            border-left: 2px solid transparent;
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            overflow: hidden;
        }
        .terminal-tab.active {
            border-left-color: #b18cff;
            color: #ffffff;
        }
        /* Nested session rail: the disclosure sits at the LEFT edge, the
           close/badge at the RIGHT; children indent under their parent. */
        .terminal-tab .tab-chevron {
            flex: none;
            width: 12px;
            text-align: center;
            color: rgba(255, 255, 255, 0.35);
            font-size: 10px;
        }
        .terminal-tab.child-tab { font-size: 11px; }
        .terminal-tab.child-tab .tab-chevron { color: rgba(255,255,255,0.25); }
        .terminal-tab.split-tab { color: rgba(177, 140, 255, 0.8); font-style: italic; }
        .terminal-tab .tab-name {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        /* Session-type chooser (Ctrl+Shift+T child / Ctrl+Shift+R root). */
        .session-chooser {
            position: fixed;
            inset: 0;
            z-index: 60;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.45);
        }
        .session-chooser[hidden] { display: none; }
        .session-chooser-card {
            min-width: 240px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: rgba(28, 28, 34, calc(0.98 * var(--ui-opacity, 1)));
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 8px;
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
        }
        .session-chooser-title {
            font-size: 11px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.45);
            margin-bottom: 4px;
        }
        .session-chooser-card button {
            text-align: left;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 5px;
            color: rgba(255, 255, 255, 0.85);
            font: inherit;
            font-size: 12px;
            padding: 8px 10px;
            cursor: pointer;
        }
        .session-chooser-card button:hover {
            border-color: rgba(177, 140, 255, 0.7);
            color: #fff;
        }
        .session-chooser-card .prompt-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 5px;
            color: #eee;
            font: 12px Menlo, Consolas, monospace;
            padding: 7px 9px;
        }
        .session-chooser-card .prompt-actions {
            display: flex;
            gap: 6px;
            margin-top: 4px;
        }
        .session-chooser-card .prompt-actions button {
            flex: 1;
            text-align: center;
        }
        /* Radial session wheel (Ctrl+Shift+T), Blender-style: icons around the
           pointer instead of a vertical list. The wheel itself is a zero-size
           anchor; items are translated into a ring by JS. */
        .session-wheel {
            position: fixed;
            width: 0;
            height: 0;
            pointer-events: none;
        }
        .session-wheel::before {
            content: '';
            position: absolute;
            width: 210px;
            height: 210px;
            left: 0;
            top: 0;
            transform: translate(-50%, -50%);
            border: 1px solid rgba(177, 140, 255, 0.16);
            border-radius: 50%;
            pointer-events: none;
        }
        .session-wheel-title {
            position: absolute;
            left: 0;
            top: 0;
            transform: translate(-50%, -50%);
            width: 150px;
            text-align: center;
            pointer-events: none;
            font-size: 10px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.45);
        }
        .session-wheel-item[hidden] { display: none; }
        .session-wheel-item {
            position: absolute;
            width: 54px;
            height: 54px;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1px;
            pointer-events: auto;
            background: rgba(28, 28, 34, calc(0.98 * var(--ui-opacity, 1)));
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 50%;
            color: rgba(255, 255, 255, 0.85);
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.45);
            cursor: pointer;
            padding: 0;
            font: inherit;
        }
        .session-wheel-item:hover {
            border-color: rgba(177, 140, 255, 0.85);
            color: #fff;
            background: rgba(48, 42, 64, 0.98);
        }
        .session-wheel-item svg {
            width: 21px;
            height: 21px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.6;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .session-wheel-item .session-label {
            font-size: 8px;
            letter-spacing: 0.04em;
            color: rgba(255, 255, 255, 0.55);
            line-height: 1;
        }
        .session-wheel-item[data-session-kind="cancel"]:hover {
            border-color: rgba(239, 83, 80, 0.8);
            color: #ef5350;
        }
        .terminal-tab:hover:not(.active) {
            color: rgba(255, 255, 255, 0.85);
        }
        /* Session close: always-visible dim glyph, red on hover. Pinned to
           the row's far edge (margin-left auto) so long names truncate
           instead of shoving the button around; generous hit area, no box. */
        .terminal-tab .close-btn {
            opacity: 0.4;
            font-size: 14px;
            line-height: 1;
            padding: 2px 6px;
            margin-left: auto;
            flex: none;
        }
        .terminal-tab:hover .close-btn { opacity: 0.75; }
        .terminal-tab .close-btn:hover {
            opacity: 1;
            color: #ef5350;
        }
        /* Unread agent-feedback count on background tabs: per-session popups
           badge THEIR OWN tab instead of splashing over the pane you are
           looking at (Warp ambient-agent behavior, made per-session). */
        .popup-badge {
            display: none;
            align-items: center;
            justify-content: center;
            min-width: 15px;
            height: 15px;
            padding: 0 4px;
            background: rgba(177, 140, 255, 0.85);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            line-height: 1;
        }

        /* Terminal area — the pane IS the terminal: no padding, no panel
           chrome, fully transparent xterm over the backdrop. */
        .terminal-container {
            position: relative;
            z-index: 10;
            flex: 1;
            min-width: 0;
            overflow: hidden;
        }
        .terminal-panel {
            width: 100%;
            height: 100%;
            display: none;
        }
        .terminal-panel.active { display: block; }
        /* ARENA: the selected parent on the LEFT, its two child sessions on the
           RIGHT, stacked vertically. This geometry is constant; the tree picks

        .terminal-container.split {

            grid-template-rows: 1fr 1fr;
            gap: 0;

            height: auto;

            grid-column: 1;
            grid-row: 1 / span 2;
            border-right: 1px solid rgba(255, 255, 255, 0.12);

        .terminal-container.split .terminal-panel.split-child {
            grid-column: 2;
            border-left: none;

        /* Warp-style assist input: ONE input surface spanning the window.
           While the agent owns the pane it is the agent-editor (instructions
           to the agent); when you take over, Enter sends raw text to the

        #assistBar {

            flex: none;

        .confidence-ring::after {
            content: '';
            position: absolute;
            inset: 3px;
            border-radius: 50%;
            background: #14151a;
        }
        #confidenceLabel {
            font-family: Menlo, Consolas, monospace;
            color: rgba(255, 255, 255, 0.6);
            white-space: nowrap;
        }
        /* Model picker: a status-bar control that never looks like a form —
           flat, monospace, the same quiet grey as its neighbours. */
        .status-select {
            appearance: none;
            -webkit-appearance: none;
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.75);
            font: 11px 'Menlo', Consolas, monospace;
            padding: 0 2px;
            max-width: 220px;
            cursor: pointer;
            outline: none;
        }
        .status-select:hover { color: #ffffff; }
        .status-select option { background: #14151a; color: #e8e8e8; }
        .status-select.empty { color: rgba(255, 255, 255, 0.35); }

        /* Ownership indicator (Warp TuiInputTarget made visible): ai = the
           agent owns input and drives this pane; julia = you own it. THE one
           mode indicator (the assist bar carries no duplicate chip). Click
           toggles Take Over / handing the pane back to the agent. */
        #ownershipPill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 2px 8px;
            color: rgba(255, 255, 255, 0.85);
            font-size: 11px;
            cursor: pointer;
            user-select: none;
        }
        #ownershipPill:hover {
            color: #ffffff;
        }
        #ownershipPill .pill-dot {
            width: 7px;
            height: 7px;
            background: var(--accent, #4f9cf9);
        }
        #ownershipPill.owner-agent .pill-dot {
            background: #b18cff;
            box-shadow: 0 0 6px rgba(177, 140, 255, 0.8);
        }
        #ownershipPill .owner-user .pill-dot {
            background: #35c28f;
        }

        /* xterm injects its CSS at runtime, i.e. AFTER this sheet, and its viewport is
           `overflow-y: scroll`: a 13px lane with a bright default track sits beside the
           pane even when there is nothing to scroll. Keep the lane (the terminal width
           must not shift when the scrollback grows) but make it ours. */
        .xterm .xterm-viewport::-webkit-scrollbar {
            width: 12px;
            background: transparent !important;
        }
        .xterm .xterm-viewport::-webkit-scrollbar-track,
        .xterm .xterm-viewport::-webkit-scrollbar-track-piece {
            background: transparent !important;
        }
        .xterm .xterm-viewport::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.16) !important;
            border: 3px solid transparent !important;
            background-clip: content-box !important;
            border-radius: 6px !important;
        }
        .xterm .xterm-viewport::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.32) !important;
            background-clip: content-box !important;
        }
        .xterm .xterm-viewport::-webkit-scrollbar-corner,
        .xterm .xterm-viewport::-webkit-scrollbar-button { background: transparent !important; }

        /* Scrollbars: dark, thin, and transparent when idle. macOS "always show
           scroll bars" paints a bright track on this dark UI, and xterm's
           viewport is `scroll` even before anything overflows. */
        ::-webkit-scrollbar { width: 12px; height: 12px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.16);
            border: 3px solid transparent;
            background-clip: content-box;
            border-radius: 6px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.32);
            background-clip: content-box;
        }
        ::-webkit-scrollbar-corner,
        ::-webkit-scrollbar-button { background: transparent; display: none; }

        /* Activity rail — the per-session agent conversation (you / agent /
           thinking / system) plus the assist input at its foot. */
        /* Chat rail width is DRAGGABLE (the hand grip on its left edge) and
           persisted; --chat-width is the single source of truth. */
        #chatResizer {
            flex: none;
            width: 7px;
            cursor: col-resize;
            background: transparent;
            position: relative;
        }
        #chatResizer::after {
            content: '';
            position: absolute;
            top: 0; bottom: 0; left: 3px;
            width: 1px;
            background: rgba(255, 255, 255, 0.10);
        }
        #chatResizer:hover::after, #chatResizer.dragging::after {
            background: rgba(177, 140, 255, 0.75);
            width: 2px;
        }
        /* CHAT-ONLY: no terminal yet — the conversation owns the whole window. */
        .workspace.chat-only .terminal-tabs,
        .workspace.chat-only .terminal-container,
        .workspace.chat-only #chatResizer { display: none; }
        .workspace.chat-only #thinkingPanel {
            flex: 1 1 auto;
            width: auto;
            border-left: none;
        }
        /* A BROWSER TAB: the terminal pane becomes a live browser panel; the
           chat rail stays at its usual width. */
        #browserPanel {
            flex: 1;
            min-width: 0;
            display: none;
            flex-direction: column;
            background: #101014;
        }
        .workspace.browser-focus #terminal-container,
        .workspace.browser-focus #chatResizer { display: none; }
        .workspace.browser-focus #browserPanel { display: flex; }
        .browser-bar {
            flex: none;
            display: flex;
            gap: 6px;
            padding: 6px 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        }
        .browser-bar input {
            flex: 1;
            min-width: 0;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 4px;
            color: #eee;
            font: 12px Menlo, Consolas, monospace;
            padding: 5px 8px;
        }
        .browser-bar button {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 4px;
            color: rgba(255, 255, 255, 0.8);
            font: 11px inherit;
            padding: 4px 9px;
            cursor: pointer;
        }
        #browserFrame {
            flex: 1;
            border: 0;
            background: #fff;
        }
        #pdfPanel {
            flex: 1;
            min-width: 0;
            display: none;
            overflow: hidden;
            background: rgba(20, 21, 26, 0.62);
        }
        .workspace.pdf-focus #terminal-container,
        .workspace.pdf-focus #chatResizer { display: none; }
        .workspace.pdf-focus #pdfPanel { display: flex; }
        .typst-panel { flex: 1; min-width: 0; display: none; overflow: hidden; }
        .workspace.typst-focus #terminal-container,
        .workspace.typst-focus #chatResizer { display: none; }
        .workspace.typst-focus #typstPanel { display: flex; }
        .workspace.typst-focus #pdfPanel,
        .workspace.typst-focus #browserPanel { display: none; }
        #typstEditorHost, #typstPdfHost { position: relative; min-width: 0; height: 100%; overflow: hidden; }
        #typstEditorHost { flex: 1.35; border-right: 1px solid rgba(255,255,255,0.08); }
        #typstPdfHost { flex: 1; }
        #pdfLayerHost { width: 100%; height: 100%; }
        .browser-native-note {
        .browser-native-note {
            flex: none;
            font: 10px Menlo, Consolas, monospace;
            color: rgba(177, 140, 255, 0.7);
            padding: 0 4px;
            white-space: nowrap;
        }
        /* A CHAT TAB: keep the tab rail, hide the terminal pane, let the chat
           rail fill the workspace. */
        .workspace.chat-focus .terminal-container,
        .workspace.chat-focus #chatResizer { display: none; }
        .workspace.chat-focus #thinkingPanel {
            flex: 1 1 auto;
            width: auto;
            border-left: none;
        }
        #thinkingPanel {
            flex: none;                       /* the third column of the workspace */
            width: var(--chat-width, 340px);
            min-height: 0;
            display: flex;
            flex-direction: column;
            background: transparent;         /* the pane paints nothing either: the
                                                photo is the surface for both, and
                                                the hairline is what separates them */
            border-left: 1px solid rgba(255, 255, 255, 0.12);
            overflow: hidden;
        }

        /* Chat transcript: one bubble per message, role-tagged and aligned
           like a normal messenger (you right, agent left). Same-role lines
           arriving back-to-back grow the SAME bubble, so a streamed message
           reads as one message instead of a flood. Colors come from the app's
           own palette: purple = the agent (ownership pill / status line),
           blue = you, amber = reasoning (dim), grey = system. */
        /* Bottom-of-chat container: the live phase line and input are ONE footer
           block. The transcript above is a separate flex row; this footer can
           never paint over its last message. */
        #chatFooter {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 2;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(20, 21, 26, calc(0.55 * var(--ui-opacity, 1)));
        }
        /* Live model/phase line: its own row inside the footer, directly above
           the input block. Replaced in place and cleared when the call returns. */
        #chatProgress {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            min-height: 20px;
            max-height: 2.8em;
            overflow: hidden;
            padding: 4px 12px 0;
            white-space: nowrap;
            text-overflow: ellipsis;
            font: 11px Menlo, Consolas, monospace;
            color: rgba(255, 255, 255, 0.58);
        }
        #chatProgress:not(:empty)::before {
            content: '\25cf ';
            color: var(--term-bright-magenta);
        }
        #chatFooter #assistBar { border-top: none; }
        #chatStreamTabs {
            flex: none;
            display: flex;
            gap: 4px;
            padding: 4px 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .chat-stream-tab {
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            color: rgba(255, 255, 255, 0.45);
            font: inherit;
            font-size: 11px;
            padding: 3px 8px;
            cursor: pointer;
        }
        .chat-stream-tab.active {
            color: #fff;
            border-bottom-color: var(--term-bright-magenta);
        }
        #agentChatLog {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            overscroll-behavior: contain;
            padding: 12px 12px 8px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        #agentChatLog .chat-empty {
            margin: auto;
            color: rgba(255, 255, 255, 0.3);
            font-size: 12px;
            text-align: center;
        }
        #agentChatLog .chat-msg {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            max-width: 100%;
        }
        #agentChatLog .chat-who {
            font-size: 10px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin: 0 2px 3px;
        }
        #agentChatLog .chat-bubble {
            max-width: 92%;
            padding: 7px 10px;
            border-radius: 10px;
            font-family: 'Menlo', Consolas, 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.45;
            white-space: pre-wrap;
            word-break: break-word;
        }
        /* Markdown emits real block elements with newline text nodes between
           them; pre-wrap rendered those source newlines as extra blank lines,
           making reasoning look double-spaced and "off". Blocks own spacing. */
        #agentChatLog .chat-bubble.md {
            white-space: normal;
        }
        /* Agent text — the same quiet treatment as the reasoning block: rail
           flush against the left edge (square left corners), translucent
           panel. The rail carries the identity color (purple = the agent);
           reasoning keeps its amber and its italics. */
        #agentChatLog .role-text .chat-who { color: rgba(214, 112, 214, 0.8); }
        #agentChatLog .role-text .chat-bubble {
            max-width: 100%;
            background: rgba(214, 112, 214, 0.05);
            border: 1px solid transparent;
            border-left: 2px solid rgba(214, 112, 214, 0.55);
            border-radius: 0 3px 3px 0;   /* flush left: the rail IS the edge */
            color: rgba(255, 255, 255, 0.88);
        }
        /* You — the agent blocks mirrored: rail on the RIGHT edge (square corners,
           translucent panel), the "info" blue used by the feedback popups. */
        #agentChatLog .role-user { align-items: flex-end; }
        #agentChatLog .role-user .chat-who { color: rgba(59, 142, 234, 0.85); }
        #agentChatLog .role-user .chat-bubble {
            max-width: 100%;
            background: rgba(59, 142, 234, 0.06);
            border: 1px solid transparent;
            border-right: 2px solid rgba(59, 142, 234, 0.5);
            border-radius: 0;
            color: rgba(255, 255, 255, 0.9);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        /* Reasoning — dim amber, italic, rail on the left: read as asides. */
        #agentChatLog .role-thinking .chat-who { color: rgba(229, 229, 16, 0.6); }
        #agentChatLog .role-thinking .chat-bubble {
            /* Reasoning is a full-width band under its message, not a bubble
               that hugs a short thought: occupy the chat pane's width. */
            width: 100%;
            max-width: 100%;
            background: rgba(229, 229, 16, 0.05);
            border: 1px solid transparent;
            border-left: 2px solid rgba(229, 229, 16, 0.45);
            border-radius: 0 3px 3px 0;   /* flush left: the rail IS the edge */
            color: rgba(255, 255, 255, 0.62);
            font-size: 11px;
            line-height: 1.6;
            font-style: italic;
            padding: 9px 12px;
        }
        /* Markdown inside agent text (micromark + GFM, the bundles FlootyApp uses).
           Code blocks get the terminal's own colours so prose and commands read as
           one thing. */
        /* Diagnostics belong to the transcript: warnings and errors are kept as
           messages (amber / red) instead of vanishing with the status line. */
        /* Monitor REASONING: a monitor trace, never the driver's thinking.
           Distinct role/label so the two are not confused in the rail. */
        #agentChatLog .role-monitorThinking .chat-who {
            color: rgba(140, 190, 255, 0.7);
        }
        #agentChatLog .role-monitorThinking .chat-bubble {
            width: 100%;
            max-width: 100%;
            background: rgba(120, 170, 255, 0.035);
            border: 1px solid transparent;
            border-left: 2px solid rgba(120, 170, 255, 0.35);
            border-radius: 0 3px 3px 0;
            color: rgba(220, 232, 255, 0.62);
            font-size: 11px;
            line-height: 1.6;
            font-style: italic;
            padding: 9px 12px;
        }
        /* Ambient MONITOR insight: distinct from the commissioned agent's voice. */
        #agentChatLog .role-monitor .chat-who { color: rgba(140, 190, 255, 0.7); }
        #agentChatLog .role-monitor .chat-bubble {
            max-width: 100%;
            background: rgba(120, 170, 255, 0.05);
            border: 1px solid transparent;
            border-left: 2px solid rgba(120, 170, 255, 0.4);
            border-radius: 0 3px 3px 0;
            color: rgba(220, 232, 255, 0.75);
            font-style: italic;
            font-size: 11px;
        }
        #agentChatLog .role-warn .chat-who { color: rgba(255, 184, 76, 0.85); }
        #agentChatLog .role-warn .chat-bubble {
            max-width: 100%;
            background: rgba(255, 184, 76, 0.06);
            border: 1px solid transparent;
            border-left: 2px solid rgba(255, 184, 76, 0.55);
            border-radius: 0 3px 3px 0;
            color: rgba(255, 224, 180, 0.9);
            font-family: Menlo, Consolas, monospace;
            font-size: 11px;
            white-space: pre-wrap;
        }
        #agentChatLog .role-error .chat-who { color: rgba(255, 105, 105, 0.9); }
        #agentChatLog .role-error .chat-bubble {
            max-width: 100%;
            background: rgba(255, 80, 80, 0.07);
            border: 1px solid transparent;
            border-left: 2px solid rgba(255, 90, 90, 0.7);
            border-radius: 0 3px 3px 0;
            color: rgba(255, 205, 205, 0.95);
            font-family: Menlo, Consolas, monospace;
            font-size: 11px;
            white-space: pre-wrap;
        }
        #agentChatLog .chat-bubble.md p { margin: 0 0 8px; line-height: 1.55; }
        #agentChatLog .chat-bubble.md > :first-child { margin-top: 0; }
        #agentChatLog .chat-bubble.md > :last-child { margin-bottom: 0; }
        #agentChatLog .chat-bubble.md h1,
        #agentChatLog .chat-bubble.md h2,
        #agentChatLog .chat-bubble.md h3 { font-size: 12px; margin: 8px 0 4px; color: #fff; }
        #agentChatLog .chat-bubble.md ul,
        #agentChatLog .chat-bubble.md ol { margin: 5px 0 8px 20px; }
        #agentChatLog .chat-bubble.md li { margin: 3px 0; line-height: 1.55; }
        #agentChatLog .chat-bubble.md code {
            font-family: 'Menlo', Consolas, monospace; font-size: 11px;
            background: rgba(255, 255, 255, 0.09); padding: 1px 4px; border-radius: 3px;
        }
        #agentChatLog .chat-bubble.md pre {
            margin: 6px 0; padding: 6px 8px; overflow-x: auto;
            background: rgba(0, 0, 0, 0.35);
            border-left: 2px solid rgba(214, 112, 214, 0.5);
        }
        #agentChatLog .chat-bubble.md pre code { background: none; padding: 0; }
        #agentChatLog .chat-bubble.md a { color: var(--term-bright-blue); }
        #agentChatLog .chat-bubble.md blockquote {
            margin: 6px 0; padding-left: 8px; color: rgba(255, 255, 255, 0.7);
            border-left: 2px solid rgba(255, 255, 255, 0.2);
        }
        #agentChatLog .chat-bubble.md table { border-collapse: collapse; margin: 6px 0; font-size: 11px; }
        #agentChatLog .chat-bubble.md th,
        #agentChatLog .chat-bubble.md td { border: 1px solid rgba(255, 255, 255, 0.15); padding: 2px 6px; }
        #agentChatLog .chat-bubble.md hr { border: none; border-top: 1px solid rgba(255, 255, 255, 0.15); margin: 8px 0; }
        #agentChatLog .chat-bubble.md img { max-width: 100%; }
        /* Reasoning is italic; its code is not (and stays readable). */
        #agentChatLog .role-thinking .chat-bubble code,
        #agentChatLog .role-thinking .chat-bubble pre,
        #agentChatLog .role-thinking .chat-bubble blockquote { font-style: normal; }

        /* Tool call + result as ONE foldable block: the command line stays visible,
           the output is behind the fold (the pane still shows the real thing). */
        #agentChatLog .role-tool { align-items: stretch; }
        #agentChatLog .chat-tool {
            font-family: 'Menlo', Consolas, 'Courier New', monospace;
            font-size: 11px;
            background: rgba(255, 255, 255, 0.03);
            border-left: 2px solid rgba(255, 255, 255, 0.18);
        }
        #agentChatLog .chat-tool > summary {
            display: flex; gap: 8px; align-items: baseline;
            padding: 4px 8px; cursor: pointer; user-select: none;
            list-style: none; color: rgba(255, 255, 255, 0.75);
        }
        #agentChatLog .chat-tool > summary::-webkit-details-marker { display: none; }
        #agentChatLog .chat-tool > summary::before {
            content: '\25B8';                 /* ▸ folded */
            color: rgba(255, 255, 255, 0.4);
            font-size: 10px;
        }
        #agentChatLog .chat-tool[open] > summary::before { content: '\25BE'; }   /* ▾ open */
        #agentChatLog .tool-name { color: var(--term-bright-magenta); }
        #agentChatLog .tool-detail {
            flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        #agentChatLog .tool-state { flex: none; opacity: 0.8; }
        #agentChatLog .tool-state.running { color: var(--term-bright-magenta); }
        #agentChatLog .tool-state.ok { color: var(--term-bright-green); }
        #agentChatLog .tool-state.err { color: var(--term-bright-red); }
        #agentChatLog .tool-body { padding: 0 8px 6px 18px; }
        #agentChatLog .tool-body pre {
            margin: 0; white-space: pre-wrap; word-break: break-word;
            color: rgba(255, 255, 255, 0.8);
        }

        /* System notices — quiet, dashed, no claim to be speech. */
        #agentChatLog .role-system .chat-who { color: rgba(212, 212, 212, 0.35); }
        #agentChatLog .role-system .chat-bubble {
            max-width: 100%;
            background: transparent;
            border: 1px dashed rgba(212, 212, 212, 0.2);
            color: rgba(212, 212, 212, 0.6);
            font-size: 11px;
        }

        /* Scratch space — collapsible right rail with Julia CodeMirror */
        .scratch-rail {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            width: 0;
            overflow: hidden;
            transition: width 0.28s ease;
        }
        .scratch-rail.expanded { width: 360px; }
        .scratch-rail .scratch-header {
            flex: none;
            display: flex;
            align-items: center;
            padding: 6px 14px;
            background: rgba(255, 255, 255, 0.04);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.45);
            user-select: none;
        }
        .scratch-rail .scratch-header:hover { color: rgba(255, 255, 255, 0.8); }
        .scratch-rail .scratch-handle { margin-right: 8px; font-size: 12px; transition: transform 0.2s ease; }
        .scratch-rail.expanded .scratch-handle { transform: rotate(90deg); }
        .scratch-rail .scratch-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(12, 13, 16, 0.96);
            border-left: 1px solid rgba(255, 255, 255, 0.12);
        }
        #scratchEditor .CodeMirror {
            height: auto !important;
            min-height: 140px;
            background: transparent !important;
            color: #e0e0e0;
            font: 13px 'Menlo', Consolas, 'Courier New', monospace;
            line-height: 1.4;
        }
        #scratchEditor .CodeMirror-gutters { display: none; }
        #scratchEditor .CodeMirror-cursor { border-left: 1.5px solid #b18cff; }
        #scratchEditor .CodeMirror-selected { background: rgba(177, 140, 255, 0.2) !important; }
        .scratch-rail .scratch-send {
            flex: none;
            padding: 6px 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            text-align: right;
        }
        .scratch-rail .scratch-send button {
            border: none;
            padding: 4px 12px;
            font-size: 12px;
            color: #b18cff;
            cursor: pointer;
            background: transparent;
        }
        .scratch-rail .scratch-send button:hover { text-decoration: underline; }

        /* Syntax view — toggleable read-only Julia-aware display */
        #syntaxPanel {
            position: fixed;
            z-index: 10;
            bottom: 52px;
            right: 0;
            width: 0;
            overflow: hidden;
            transition: width 0.28s ease;
            display: flex;
            flex-direction: column;
            background: rgba(12, 13, 16, 0.96);
            border-left: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: -4px 0 20px rgba(0, 0, 0, 0.4);
        }
        #syntaxPanel.expanded { width: 360px; }
        #syntaxPanel .syntax-header {
            flex: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 14px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.45);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        #syntaxPanel .syntax-handle { cursor: pointer; font-size: 12px; }
        #syntaxPanel .syntax-close {
            cursor: pointer;
            color: rgba(255, 255, 255, 0.4);
            font-size: 13px;
            padding: 2px 8px;
        }
        #syntaxPanel .syntax-close:hover { color: #ef5350; }
        #syntaxEditor .CodeMirror {
            height: auto !important;
            background: transparent !important;
            color: #e0e0e0;
            font: 13px 'Menlo', Consolas, 'Courier New', monospace;
            line-height: 1.4;
        }
        #syntaxEditor .CodeMirror-gutters { display: none; }
    </style>
</head>

    <script>
        // Early diagnostics: ANY page error/rejection surfaces on the
        // flootyDebug channel — console.* is invisible in probe windows.
        window.addEventListener('error', e => {
            try { window.flootyDebug && window.flootyDebug('PAGE_ERROR ' +
                (e && e.message) + ' @line' + (e && e.lineno)); } catch (_) {}
        });
        window.addEventListener('unhandledrejection', e => {
            try { window.flootyDebug && window.flootyDebug('PAGE_REJECTION ' +
                (e && e.reason)); } catch (_) {}
        });

        // Default command for new terminals (must match the Julia-side default).
        const defaultShellCommand = navigator.platform.toUpperCase().includes('WIN') ? 'powershell' : 'zsh -i';

        // Terminal management
        let terminals = {};
        let activeTerminalId = null;
        let terminalCounter = 1;
        // Diagnostics: the page's terminals (the probes need the model).
        window.flootyTerminals = terminals;

        // ---- the data plane: one binary channel per session -----------------
        //
        // The PTY bytes travel over a binary WebSocket (raw bytes, no JSON,
        // no per-chunk eval!, no per-keystroke RPC round trip). The CONTROL
        // plane (take over, prompts, snapshots, popups) stays on the
        // Webviews RPC — this only moves the byte stream.
        //
        // The page keeps its own output handling (the bind handshake, the
        // fan-out over the tabs bound to one session), so the channel hands
        // the RAW bytes to handleTerminalOutput instead of writing the model.
        const channelPorts = {};
        // Diagnostics: the open data-plane channels (session id -> channel).
        window.flootyChannels = channelPorts;

        function channelFor(juliaId) {
            return (juliaId && channelPorts[juliaId]) ? channelPorts[juliaId] : null;
        }

        // The terminal that shows a session (the first one wins).
        function findTerminalByJuliaId(juliaId) {
            for (const id of Object.keys(terminals)) {
                if (terminals[id].juliaId === juliaId) return terminals[id];
            }
            return null;
        }

        // The size goes over the session's channel (the RPC is gone). A resize
        // that arrives before the channel is up is held and sent with it.
        function sendTerminalResize(info) {
            if (!info || !info.juliaId || !info.term) return;
            const channel = channelFor(info.juliaId);
            if (channel && channel.isLive && channel.isLive()) {
                channel.resize(info.term.cols, info.term.rows);
            } else {
                info.pendingResize = { cols: info.term.cols, rows: info.term.rows };
            }
        }

        // The channel is up: send the keystrokes and the size that were held
        // while it opened.
        function flushChannelPending(info) {
            if (!info) return;
            const channel = channelFor(info.juliaId);
            if (!channel || !channel.isLive || !channel.isLive()) return;
            const held = info.pendingInput;
            if (held && held.length) {
                info.pendingInput = [];
                for (let i = 0; i < held.length; i++) channel.input(held[i]);
            }
            if (info.pendingResize) {
                const r = info.pendingResize;
                info.pendingResize = null;
                channel.resize(r.cols, r.rows);
            }
        }

        function openChannel(juliaId, term) {
            if (!juliaId || !term) return null;
            if (channelPorts[juliaId]) return channelPorts[juliaId];
            const port = window.FLOOTY_TERMINAL && window.FLOOTY_TERMINAL.channelPort;
            if (!port || !window.FlootyTerminalCore) return null;
            try {
                const core = new window.FlootyTerminalCore.TerminalCore({
                    term: term,
                    wsPort: port,
                    sessionId: juliaId,
                    onOutput: (bytes) => {
                        try { window.handleTerminalOutput(juliaId, bytes); } catch (e) {}
                    },
                    // The channel is up: send what was held while it opened.
                    onReady: () => {
                        const info = findTerminalByJuliaId(juliaId);
                        if (info) flushChannelPending(info);
                    }
                });
                core.connect();
                channelPorts[juliaId] = core;
                return core;
            } catch (e) {
                try { window.flootyDebug && window.flootyDebug('channel open failed: ' + e); } catch (_) {}
                return null;
            }
        }

        // Initialize: create the first terminal automatically, then tell Julia
        // the UI is live. When FLOOTY_UI_AUTOCLOSE=1 the backend answers
        // "autoclose" so this page performs the SAME native close as the glass
        // Close button — the probe's teardown path runs from inside the loop,
        // mirroring upstream's passing test pattern.
        document.addEventListener('DOMContentLoaded', () => {
            // Page-level event diagnostics (mirrored to Julia stdout).
            const dbg = m => { try { window.flootyDebug && window.flootyDebug(m); } catch (e) {} };
            document.addEventListener('keydown', e => {
                const ae = document.activeElement;
                dbg('keydown key=' + e.key + ' active=' +
                    (ae ? (ae.className || ae.tagName) : 'none'));
            }, true);
            document.addEventListener('mousedown', e => {
                const t = e.target;
                dbg('mousedown target=' + ((t && (t.className || t.tagName)) || '?'));
            }, true);

            setTimeout(() => {
                // Ping BEFORE spawning: the backend may opt out of the default
                // auto terminal (Warp-style single-PTY embedding where Julia
                // code adopts its own session into this window).
                callJulia('flootyUiReady', '{}').then(result => {
                    dbg('readyPing result=' + JSON.stringify(result));
                    if (result && result.success && result.chatSession) {
                        CHAT_SESSION_ID = result.chatSession;
                    }
                    if (result && result.success && result.autoSpawnTypst === '1') {
                        spawnTypstSession('');
                    } else if (!(result && result.success && result.skipAutocreate === '1')) {
                        createTerminal();
                        setTimeout(forceFitActive, 50);
                        setTimeout(forceFitActive, 200);
                        setTimeout(forceFitActive, 600);
                    } else {
                        dbg('auto-create skipped by backend');
                    }
                    // Initial ownership paint: an adopted session already
                    // owned by the agent shows its pill immediately (no julia
                    // flash).
                    if (result && result.success && result.initialOwner === 'agent') {
                        const activeInfo = terminals[activeTerminalId];
                        if (activeInfo) activeInfo.owner = 'agent';
                        setOwnershipUi('agent');
                    }
                    updateLayoutMode();
                    if (result && result.success && result.action === 'autoclose') {
                        // Popup probe keeps the window open ~2s so pushed
                        // popups render and acknowledge before we close.
                        const waitMs = (result && result.popupProbe === '1') ? 2000 : 0;
                        setTimeout(() => {
                            dbg('autoclose requested by backend');
                            closeWindow();
                        }, waitMs);
                    } else {
                        // Same delayed-focus recipe the minimal probe proved:
                    }
                }).catch(err => {
                    // console.* is invisible here (no devtools in probes) —
                    // mirror failures into the flootyDebug stdout channel.
                    dbg('readyPing FAILED: ' + err);
                    createTerminal();   // fail open: behave like before
                    setTimeout(forceFitActive, 50);
                    setTimeout(forceFitActive, 200);
                    setTimeout(forceFitActive, 600);
                });
            }, 500);
        });

        function xtermTheme() {
            return {
                // TRANSPARENT on purpose: the terminal pane sits over the app's
                // wallpaper (the .terminal-panel CSS keeps every xterm layer
                // transparent), and the DOM renderer left its rows transparent.
                // The WebGL renderer instead paints the theme background as a
                // full-screen rectangle — an opaque value here would turn the
                // pane into a solid slab and hide the wallpaper.
                background: 'rgba(30, 30, 30, 0)',
                foreground: '#d4d4d4',
                cursor: '#ffffff',
                selectionBackground: '#264f78',
                black: '#000000',
                red: '#cd3131',
                green: '#0dbc79',
                yellow: '#e5e510',
                blue: '#2472c8',
                magenta: '#bc3fbc',
                cyan: '#11a8cd',
                white: '#e5e5e5',
                brightBlack: '#666666',
                brightRed: '#f14c4c',
                brightGreen: '#23d18b',
                brightYellow: '#f5f543',
                brightBlue: '#3b8eea',
                brightMagenta: '#d670d6',
                brightCyan: '#29b8db',
                brightWhite: '#ffffff'
            };
        }

        // ---- GPU-accelerated rendering (WebGL2) --------------------------------
        //
        // xterm.js paints its grid with the DOM renderer by default: one DOM
        // element per cell, re-styled on every frame. That is the bottleneck
        // for a 10k-line scrollback and for bursts of PTY output.
        //
        // The official WebGL addon (published together with xterm 5.5.0)
        // replaces that renderer with a WebGL2 canvas: glyphs are rasterized
        // into a texture atlas once, and the grid is drawn on the GPU. This
        // is the same acceleration terax-ai gets from its own WebGL/WebGPU
        // ghostty surface — but upstream xterm.js ships NO WebGPU renderer
        // (no such addon exists), so WebGL2 is the GPU path here; a WebGPU
        // surface would mean writing a renderer against xterm's private
        // internals.
        //
        // Failure is never fatal: a missing addon, a machine without WebGL2
        // or a lost GPU context falls back to the DOM renderer, so the
        // terminal always renders something.
        //
        // Returns {state, reason, addon}: 'webgl' when the GPU renderer is
        // live, 'dom' when we fell back (reason says why).
        function enableGpuRenderer(term) {
            // The UMD build exposes the MODULE namespace as the global, so the
            // class lives at WebglAddon.WebglAddon (the fit addon works the
            // same way: FitAddon.FitAddon). Accept a plain-function global too
            // so a different build flavor of the addon still works.
            const ctor = (typeof WebglAddon === 'function') ? WebglAddon
                        : (window.WebglAddon && window.WebglAddon.WebglAddon);
            if (typeof ctor !== 'function') {
                return { state: 'dom', reason: 'addon-missing', addon: null };
            }
            let addon = null;
            try {
                addon = new ctor();
                // loadAddon activates the addon AND ties its lifetime to the
                // terminal (xterm disposes it with the terminal).
                term.loadAddon(addon);
            } catch (e) {
                let reason = 'activate-failed';
                try { reason = 'activate-failed: ' + (e && e.message ? e.message : e); } catch (_) {}
                try { if (addon) addon.dispose(); } catch (_) {}
                return { state: 'dom', reason: reason, addon: null };
            }
            const info = { state: 'webgl', reason: '', addon: addon };
            try {
                addon.onContextLoss(() => {
                    // The GPU context died: drop back to the DOM renderer
                    // instead of leaving a frozen canvas on screen.
                    info.state = 'dom';
                    info.reason = 'context-lost';
                });
            } catch (e) { /* no context-loss events: nothing to do */ }
            // Evidence that the WebGL renderer really took over: it paints
            // into its OWN <canvas> (the DOM renderer has none, and the
            // link-underline layer's canvas is 2D, so a webgl2 context is the
            // unambiguous signal).
            try {
                let gl = false;
                const cvs = term.element ?
                    term.element.querySelectorAll('canvas') : [];
                for (const cv of cvs) {
                    if (cv.getContext('webgl2')) { gl = true; break; }
                }
                info.canvas = gl;
            } catch (e) { info.canvas = false; }
            return info;
        }

        // Push the live renderer state to the Julia side. The webview has no
        // devtools, so this push channel is the only way the app (and the
        // probes) can SEE which renderer is actually painting.
        function reportGpuState() {
            const perTerminal = Object.keys(terminals).map(id => ({
                id: id,
                state: (terminals[id].gpu && terminals[id].gpu.state) || 'unknown',
                reason: (terminals[id].gpu && terminals[id].gpu.reason) || '',
                canvas: !!(terminals[id].gpu && terminals[id].gpu.canvas)
            }));
            let webgl2 = false;
            try {
                webgl2 = !!document.createElement('canvas').getContext('webgl2');
            } catch (e) { webgl2 = false; }
            const payload = JSON.stringify({ webgl2: webgl2, terminals: perTerminal });
            try { window.flootyDebug && window.flootyDebug('GPU ' + payload); } catch (e) {}
            callJulia('flootyGpuReport', payload).catch(() => {});
        }

        // Shared keystroke plumbing for BOTH created and adopted tabs:
        // xterm onData -> backend PTY (writes are ALWAYS permitted — the
        // duplex guarantee), resize -> PTY winsize. Without wiring onData,
        // an adopted tab renders output but SILENTLY SWALLOWS every
        // keystroke — the user cannot type at all.
        function wireTerminalInput(terminalId) {
            const dbg = m => { try { window.flootyDebug && window.flootyDebug(m); } catch (e) {} };
            const term = terminals[terminalId].term;
            term.onData(data => {
                const info = terminals[terminalId];
                dbg('onData ' + terminalId + ' juliaId=' +
                    (info ? info.juliaId : 'no-info') + ' data=' +
                    JSON.stringify(data));
                if (info && info.juliaId) {
                    // The data plane is the session's binary channel: a
                    // keystroke goes over the socket, never over the RPC.
                    // The channel takes a round trip to open, so what arrives
                    // before it is up is held and sent with it.
                    const channel = channelFor(info.juliaId);
                    if (channel && channel.isLive && channel.isLive()) {
                        channel.input(data);
                        const held = info.pendingInput;
                        if (held && held.length) {
                            info.pendingInput = [];
                            for (let i = 0; i < held.length; i++) channel.input(held[i]);
                        }
                    } else {
                        (info.pendingInput = info.pendingInput || []).push(data);
                    }
                } else if (info) {
                    // No PTY attached yet — echo locally so typing is visible.
                    info.term.write(data);
                }
            });
            term.onResize(({ cols, rows }) => {
                const info = terminals[terminalId];
                if (info && info.juliaId) {
                    // The size goes over the channel too (the RPC is gone).
                    const channel = channelFor(info.juliaId);
                    if (channel && channel.isLive && channel.isLive()) {
                        channel.resize(cols, rows);
                    } else {
                        info.pendingResize = { cols: cols, rows: rows };
                    }
                }
                scheduleTerminalBufferPush(info);
            });
            // xterm's selection never touches the DOM selection, so the app-level
            // copy would not see it without this.
            term.onSelectionChange(() => reportSelection());
        }

        // ---- Rendered xterm viewport reporting -----------------------------
        // The agent's picture of a terminal must be the screen the USER
        // sees, not the raw escape-laden byte tail. These helpers serialize
        // the visible window of a tab's xterm buffer and push it (debounced)
        // to Julia, which caches it per session id for agentSnapshot.
        // NO char cap: the model must see the same buffer the user does. The
        // budget/optimisation work happens upstream, later.
        function viewportMeta(info) {
            const meta = { rows: 0, columns: 0, scrollbackRows: 0, scrollbackTruncated: false };
            if (!info || !info.term) return meta;
            const buf = info.term.buffer.active;
            const rows = info.term.rows || 24;
            const top = (typeof buf.viewportY === 'number') ? buf.viewportY
                                                            : Math.max(0, buf.length - rows);
            meta.rows = rows;
            meta.columns = info.term.cols || 80;
            meta.scrollbackRows = Math.max(0, top);
            meta.scrollbackTruncated = top > 0;   // older lines are NOT included
            return meta;
        }
        function serializeTerminalViewport(info) {
            if (!info || !info.term) return '';
            const term = info.term;
            const buf = term.buffer.active;
            if (!buf || typeof buf.getLine !== 'function') return '';
            const rows = term.rows || 24;
            const top = (typeof buf.viewportY === 'number') ? buf.viewportY
                                                            : Math.max(0, buf.length - rows);
            // EXACTLY THE VIEWPORT: the rows the user is looking at. Scrollback is
            // NOT sent — the model sees the same window the user sees, no more and
            // no less (the snapshot says how many lines are above it).
            const start = top;
            const end = Math.min(buf.length, top + rows);
            const out = [];
            for (let y = start; y < end; y++) {
                const line = buf.getLine(y);
                // translateToString(true) only drops ATTRIBUTE-only cells: real
                // spaces written by the app (zsh's PROMPT_SP pad, a cleared
                // region) survive it, so trim the string itself.
                out.push(line ? line.translateToString(true).trimEnd() : '');
            }
            return out.join('\n');
        }

        function scheduleTerminalBufferPush(info) {
            if (!info || !info.juliaId) return;
            if (info.bufferTimer) clearTimeout(info.bufferTimer);
            info.bufferTimer = setTimeout(() => {
                info.bufferTimer = null;
                const text = serializeTerminalViewport(info);
                const meta = viewportMeta(info);
                callJulia('flootyTerminalBufferReport', JSON.stringify({
                    terminal_id: info.juliaId, text: text,
                    rows: meta.rows, columns: meta.columns,
                    scrollback_rows: meta.scrollbackRows,
                    scrollback_truncated: meta.scrollbackTruncated
                })).catch(() => {});
            }, 120);
        }
        window.flootyPushTerminalBuffer = function (sessionId) {
            for (const [, info] of Object.entries(terminals)) {
                if (info.juliaId === sessionId) { scheduleTerminalBufferPush(info); return; }
            }
        };
        // IMMEDIATE report (no 120 ms debounce), for the agent's snapshot path:
        // the agent reads the pane right after one of its commands finished, so
        // a queued-but-not-yet-sent viewport is exactly a stale screen. Returns a
        // promise so Julia can await the report actually being stored.
        window.flootyReportTerminalBufferNow = function (sessionId) {
            for (const [, info] of Object.entries(terminals)) {
                if (info.juliaId === sessionId) {
                    if (info.bufferTimer) { clearTimeout(info.bufferTimer); info.bufferTimer = null; }
                    // xterm PARSES writes asynchronously: at this instant the
                    // buffer can still be missing the chunk the agent just
                    // produced. `write('', cb)` runs cb after the pending write
                    // queue drains, so the serialization is of the screen the
                    // user is actually looking at.
                    return new Promise(function (resolve) {
                        try {
                            info.term.write('', function () {
                                const m = viewportMeta(info);
                                resolve(callJulia('flootyTerminalBufferReport', JSON.stringify({
                                    terminal_id: info.juliaId,
                                    text: serializeTerminalViewport(info),
                                    rows: m.rows, columns: m.columns,
                                    scrollback_rows: m.scrollbackRows,
                                    scrollback_truncated: m.scrollbackTruncated
                                })));
                            });
                        } catch (e) {
                            const m = viewportMeta(info);
                            resolve(callJulia('flootyTerminalBufferReport', JSON.stringify({
                                terminal_id: info.juliaId,
                                text: serializeTerminalViewport(info),
                                rows: m.rows, columns: m.columns,
                                scrollback_rows: m.scrollbackRows,
                                scrollback_truncated: m.scrollbackTruncated
                            })));
                        }
                    });
                }
            }
            return Promise.resolve(null);
        };

        // Create a new terminal tab backed by a Julia PTY.
        // ---- chat pane: draggable width + chat-only layout ------------------
        const CHAT_WIDTH_KEY = 'flooty.chatWidth';
        const CHAT_MIN = 260;
        function chatMax() {
            // Reserve the tab rail and a usable terminal pane: a 78%-of-window
            // rail plus the 176 px tab strip used to crush the terminal to 0 px
            // (xterm then reported cols=2).
            const reserve = 176 + 320;
            const byWindow = window.innerWidth - reserve;
            return Math.max(CHAT_MIN + 80, Math.min(Math.round(window.innerWidth * 0.78),
                                                    byWindow));
        }
        function setChatWidth(px, persist) {
            const w = Math.max(CHAT_MIN, Math.min(chatMax(), Math.round(px)));
            document.documentElement.style.setProperty('--chat-width', w + 'px');
            if (persist) {
                try { localStorage.setItem(CHAT_WIDTH_KEY, String(w)); } catch (e) {}
            }
            if (typeof renderActiveAgentChat === 'function') renderActiveAgentChat();
            return w;
        }
        (function restoreChatWidth() {
            let saved = 0;
            try { saved = parseInt(localStorage.getItem(CHAT_WIDTH_KEY) || '0', 10); } catch (e) {}
            saved > 0 && setChatWidth(saved, false);
        })();

        // CHAT-ONLY: with no terminal tab the conversation takes the window; the
        // first terminal (the page's own "+ New Terminal", the agent's
        // newTerminal action, or the first assist prompt) restores the split.
        function updateLayoutMode() {
            const ws = document.querySelector('.workspace');
            if (!ws) return;
            const hasTerminal = Object.keys(terminals).length > 0;
            // The root chat tab is CHAT_ONLY itself. With no terminal it is the
            // chat-only surface, not a split-pane chat session.
            const hasChat = Object.keys(chatTabs).some(id => id !== CHAT_SESSION_ID);
            const hasBrowser = Object.keys(browserTabs).length > 0;
            ws.classList.toggle('chat-only', !hasTerminal && !hasChat && !hasBrowser);
            const filetreeActive = !!activeBrowserId && browserTabs[activeBrowserId]
                && String(browserTabs[activeBrowserId].url || '').startsWith('filetree:');
            ws.classList.toggle('filetree-focus', filetreeActive);
            const fileTreePanel = document.getElementById('fileTreePanel');
            if (fileTreePanel) fileTreePanel.classList.toggle('is-open', filetreeActive);
            if (filetreeActive) refreshFileTreePane();
            if (typeof forceFitActive === 'function') {
                setTimeout(forceFitActive, 0);
                setTimeout(forceFitActive, 120);
            }
        }

        (function installChatResizer() {
            const grip = document.getElementById('chatResizer');
            if (!grip) return;
            let dragging = false;
            let startX = 0;
            let startW = 0;
            grip.addEventListener('pointerdown', (e) => {
                const panel = document.getElementById('thinkingPanel');
                if (!panel) return;
                dragging = true;
                startX = e.clientX;
                startW = panel.getBoundingClientRect().width;
                grip.classList.add('dragging');
                try { grip.setPointerCapture(e.pointerId); } catch (err) {}
                e.preventDefault();
            });
            grip.addEventListener('pointermove', (e) => {
                if (!dragging) return;
                // Dragging LEFT makes the pane WIDER (the rail is on the right).
                setChatWidth(startW + (startX - e.clientX), false);
